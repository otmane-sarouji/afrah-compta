:root{
  --ink:#122B2E;
  --ink-soft:#3E5457;
  --paper:#FBFAF6;
  --paper-raised:#FFFFFF;
  --line:#DDD9CC;
  --teal:#1F6F72;
  --teal-deep:#123E40;
  --gold:#B98A1E;
  --gold-soft:#F3E7C9;
  --danger:#A6402F;
  --ok:#3C7A4E;
  --wait:#B98A1E;
  --radius:6px;
  font-size:15px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--teal-deep);}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ---------- Zellige motif (signature element) ---------- */
.zellige-divider{height:14px;width:100%;background-image:
  linear-gradient(45deg, var(--gold) 25%, transparent 25%),
  linear-gradient(-45deg, var(--gold) 25%, transparent 25%);
  background-size:14px 14px;background-position:0 0;opacity:.55;}
.zellige-corner{width:34px;height:34px;flex:none;position:relative;}
.zellige-corner svg{width:100%;height:100%;}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--teal-deep);color:#EDEDE5;display:flex;flex-direction:column;flex:none;}
.brand{padding:22px 20px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12);}
.brand h1{color:#fff;font-size:18px;line-height:1.1;}
.brand span{display:block;font-family:'Inter';font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-top:3px;}
nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
nav button{background:none;border:none;color:#D9DED8;text-align:left;padding:10px 12px;border-radius:var(--radius);font-size:14px;display:flex;align-items:center;gap:10px;width:100%;}
nav button:hover{background:rgba(255,255,255,.07);}
nav button.active{background:var(--teal);color:#fff;font-weight:600;}
.nav-group{margin-bottom:2px;}
.nav-group-head{justify-content:space-between !important;font-weight:600;letter-spacing:.02em;color:#EDEDE5 !important;}
.nav-group-head .chev{font-size:10px;opacity:.7;transition:transform .15s;}
.nav-group-head.open .chev{transform:rotate(90deg);}
.nav-group-head.parent-active{color:#fff !important;}
.nav-sub{display:flex;flex-direction:column;gap:1px;padding:2px 0 4px 14px;border-left:1px solid rgba(255,255,255,.14);margin-left:16px;}
.nav-sub button{font-size:13px;padding:8px 10px;color:#C9D6D4;}
.nav-sub button.active{background:var(--gold);color:#2B1F04;font-weight:600;}
.sidebar-foot{padding:14px 20px;font-size:11px;color:#8CA6A4;border-top:1px solid rgba(255,255,255,.1);}

.main{flex:1;padding:32px 40px 60px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;gap:20px;}
.topbar h2{font-size:26px;}
.topbar p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px;}
.btn{border:none;border-radius:var(--radius);padding:9px 16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-deep);}
.btn-gold{background:var(--gold);color:#2B1F04;}
.btn-ghost{background:transparent;color:var(--teal-deep);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--teal);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #E4C9C2;}
.btn-sm{padding:6px 10px;font-size:12.5px;}

.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:18px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
.stat .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
.stat .value{font-family:'Fraunces',serif;font-size:24px;color:var(--teal-deep);margin-top:4px;}
.stat .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:10px 10px;border-bottom:2px solid var(--line);}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
tr:hover td{background:#F5F3EC;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em;}
.badge-brouillon{background:#EDEAE0;color:#6B6555;}
.badge-validee{background:#DCEAEA;color:var(--teal-deep);}
.badge-envoyee{background:#E4D9F2;color:#5B3B8C;}
.badge-payee{background:#DCEEDF;color:var(--ok);}
.badge-en_attente{background:#F3E7C9;color:#72520D;}
.badge-retard{background:#F5DAD3;color:var(--danger);}
.badge-impayee{background:#F5DAD3;color:var(--danger);}
.badge-annulee_avoir{background:#E3E7EA;color:#3E5457;}
.badge-partiel_avoir{background:#F3E7C9;color:#72520D;}
.badge-partielle{background:#F3E7C9;color:#72520D;}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty svg{opacity:.4;margin-bottom:10px;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(18,43,46,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
.overlay.open{display:flex;}
.modal{background:var(--paper-raised);border-radius:10px;max-width:840px;width:100%;padding:0;overflow:hidden;}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--teal-deep);}
.modal-head h3{color:#fff;font-size:18px;}
.modal-head button{background:none;border:none;color:#D9DED8;font-size:20px;line-height:1;}
.modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

.items-table th,.items-table td{padding:7px 6px;}
.items-table input,.items-table select{padding:6px 7px;font-size:13px;}
.items-table td.num{text-align:right;}
.line-actions{width:34px;}

.totals-box{margin-top:14px;margin-left:auto;width:320px;}
.totals-box div{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;}
.totals-box .ttc{font-family:'Fraunces',serif;font-size:19px;font-weight:600;border-top:2px solid var(--teal);margin-top:6px;padding-top:9px;color:var(--teal-deep);}

.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tabs button{background:var(--paper-raised);border:1px solid var(--line);padding:7px 14px;border-radius:20px;font-size:13px;}
.tabs button.active{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep);}

.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:5px;font-size:13px;background:#fff;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--teal-deep);color:#fff;padding:12px 18px;border-radius:6px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:100;}
.toast.show{opacity:1;transform:translateY(0);}

.logo-preview{width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;}

/* ---------- Print / PDF ---------- */
#printArea{display:none;}
.inv-page{width:210mm;min-height:297mm;padding:16mm 15mm;margin:0 auto;background:#fff;color:#122B2E;font-family:'Inter',sans-serif;font-size:11.5px;display:flex;flex-direction:column;}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--teal-deep);padding-bottom:14px;margin-bottom:16px;}
.inv-head .company h2{font-family:'Fraunces',serif;font-size:19px;color:var(--teal-deep);}
.inv-head .company p{margin:2px 0;font-size:10.5px;color:#465;}
.inv-title{text-align:right;}
.inv-title .doctype{font-family:'Fraunces',serif;font-size:24px;color:var(--gold);letter-spacing:.02em;}
.inv-title .num{font-family:'JetBrains Mono';font-size:13px;margin-top:4px;}
.inv-parties{display:flex;gap:20px;margin-bottom:18px;}
.inv-parties .box{flex:1;border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
.inv-parties .box h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 6px;}
.inv-parties .box p{margin:2px 0;font-size:11.5px;}
.inv-meta{display:flex;gap:24px;margin-bottom:16px;font-size:11px;}
.inv-meta div span{display:block;color:var(--ink-soft);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;}
.inv-items{width:100%;border-collapse:collapse;margin-bottom:14px;}
.inv-items th{background:var(--teal-deep);color:#fff;padding:7px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;text-align:left;}
.inv-items td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:11px;}
.inv-items td.num,.inv-items th.num{text-align:right;}
.inv-foot{display:flex;justify-content:space-between;gap:20px;margin-top:10px;}
.inv-pay{flex:1;font-size:10.5px;}
.inv-pay h4{font-size:10px;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px;}
.inv-totals{width:260px;font-size:11.5px;}
.inv-totals div{display:flex;justify-content:space-between;padding:4px 0;}
.inv-totals .ttc{font-weight:700;font-size:14px;border-top:2px solid var(--teal-deep);margin-top:4px;padding-top:8px;color:var(--teal-deep);}
.inv-notes{margin-top:16px;font-size:10.5px;color:#465;border-top:1px dashed var(--line);padding-top:10px;}
.inv-body-zone{flex:1 1 auto;}
.inv-footer-zone{margin-top:auto;padding-top:16px;flex:none;}
.inv-legal{font-size:9px;color:#8a8a7c;text-align:center;border-top:1px solid var(--line);padding-top:8px;}
.inv-legal .legal-ids{font-family:'JetBrains Mono';font-size:9px;color:var(--teal-deep);margin-bottom:3px;letter-spacing:.01em;}
.inv-bank{font-size:9.5px;color:#465;text-align:center;margin-bottom:4px;line-height:1.5;}
.inv-bank strong{color:var(--teal-deep);}

@media print{
  html,body{margin:0;padding:0;background:#fff;width:auto;height:auto;overflow:visible;}
  .app,.overlay,.toast{display:none !important;}
  #printArea{display:block;position:static;width:auto;max-width:100%;--print-scale:1;}
  @page{size:A4 portrait;margin:14mm;}

  /* --- Page A4 : la largeur utile est celle laissee par les marges @page.
     Aucun padding ici : sinon la marge serait appliquee deux fois et la
     facture n'occuperait pas toute la largeur de la feuille. --- */
  .inv-page{width:auto;max-width:100%;padding:0;margin:0;display:flex;flex-direction:column;
    font-size:calc(10.5pt * var(--print-scale, 1));line-height:1.45;}
  .inv-footer-zone{margin-top:auto;break-inside:avoid;page-break-inside:avoid;}

  /* --- Lisibilite : tailles exprimees en POINTS (unite d'impression) et non
     en pixels. 11px valait ~8,25pt a l'impression, d'ou un texte trop petit. --- */
  .inv-head .company h2{font-size:calc(15pt * var(--print-scale, 1));}
  .inv-head .company p{font-size:calc(9.5pt * var(--print-scale, 1));}
  .inv-title .doctype{font-size:calc(22pt * var(--print-scale, 1));}
  .inv-title .num{font-size:calc(12pt * var(--print-scale, 1));}
  .inv-doc-ref{font-size:calc(9pt * var(--print-scale, 1));}
  .inv-parties .box h4{font-size:calc(8.5pt * var(--print-scale, 1));}
  .inv-parties .box p{font-size:calc(10.5pt * var(--print-scale, 1));}
  .inv-parties .box p strong{font-size:calc(11.5pt * var(--print-scale, 1));}
  .inv-meta{font-size:calc(10pt * var(--print-scale, 1));}
  .inv-meta div span{font-size:calc(8.5pt * var(--print-scale, 1));}
  .inv-items th{font-size:calc(8.5pt * var(--print-scale, 1));padding:5px 4px;}
  .inv-items td{font-size:calc(10pt * var(--print-scale, 1));padding:5px 4px;}
  /* Les montants ne doivent jamais etre coupes ; les EN-TETES, eux, peuvent
     passer sur deux lignes (sinon "Montant TVA" exige 27mm de large). */
  .inv-items td.num{white-space:nowrap;font-variant-numeric:tabular-nums;}
  .inv-items th.num{white-space:normal;}
  /* Repartition des colonnes du tableau d'articles de la FACTURE uniquement
     (table.inv-items enfant direct de .inv-page). Sans largeurs imposees, les
     colonnes chiffrees accaparent la place et la designation se retrouve
     comprimee sur 4 ou 5 lignes, ce qui fait deborder la facture sur 2 pages. */
  .inv-page > table.inv-items{table-layout:fixed;}
  .inv-page > table.inv-items th:nth-child(1),.inv-page > table.inv-items td:nth-child(1){width:25%;}
  .inv-page > table.inv-items th:nth-child(2),.inv-page > table.inv-items td:nth-child(2){width:4%;}
  .inv-page > table.inv-items th:nth-child(3),.inv-page > table.inv-items td:nth-child(3){width:6%;}
  .inv-page > table.inv-items th:nth-child(4),.inv-page > table.inv-items td:nth-child(4){width:13%;}
  .inv-page > table.inv-items th:nth-child(5),.inv-page > table.inv-items td:nth-child(5){width:7%;}
  .inv-page > table.inv-items th:nth-child(6),.inv-page > table.inv-items td:nth-child(6){width:13.5%;}
  .inv-page > table.inv-items th:nth-child(7),.inv-page > table.inv-items td:nth-child(7){width:6%;}
  .inv-page > table.inv-items th:nth-child(8),.inv-page > table.inv-items td:nth-child(8){width:12%;}
  .inv-page > table.inv-items th:nth-child(9),.inv-page > table.inv-items td:nth-child(9){width:13.5%;}
  .inv-pay{font-size:calc(10pt * var(--print-scale, 1));}
  .inv-pay h4{font-size:calc(9pt * var(--print-scale, 1));}
  .inv-totals{width:74mm;font-size:calc(11pt * var(--print-scale, 1));}
  .inv-totals .ttc{font-size:calc(13pt * var(--print-scale, 1));}
  .inv-amount-words{font-size:calc(10pt * var(--print-scale, 1));}
  .inv-notes{font-size:calc(9.5pt * var(--print-scale, 1));}
  .inv-bank{font-size:calc(9pt * var(--print-scale, 1));}
  .inv-legal,.inv-legal .legal-ids{font-size:calc(8pt * var(--print-scale, 1));}

  /* --- Etats et fiches imprimes (listes, fiche client, fiche fournisseur) --- */
  #printArea table:not(.inv-items) th{font-size:calc(9pt * var(--print-scale, 1));}
  #printArea table:not(.inv-items) td{font-size:calc(9.5pt * var(--print-scale, 1));}
  #printArea .totals-box{font-size:calc(10.5pt * var(--print-scale, 1));}

  /* --- Eviter les coupures disgracieuses --- */
  .inv-items thead{display:table-header-group;}
  .inv-items tr{break-inside:avoid;page-break-inside:avoid;}
  .inv-foot{break-inside:avoid;page-break-inside:avoid;}
}
@media (max-width:900px){
  .sidebar{width:64px;}
  .brand span, nav button span.label{display:none;}
  .main{padding:20px;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .row2,.row3{grid-template-columns:1fr;}
}

<script>
/* ============================= STATE ============================= */
const DEFAULT_STATE = {
  company:{name:"", address:"", ice:"", iff:"", rc:"", tp:"", iban:"", rib:"", phone:"", email:"", logo:"", logoSize:52, capital:"", cnss:"", headerNote:"", footerNote:"", printMargin:15, printWidthPct:100, printTextSize:108, headerImage:"", headerImageReplace:false, footerImage:"", footerImageReplace:false},
  clients:[],
  contracts:[], // {id, kind:'contrat'|'marche', number, clientId, object, amount, showOnOutput}
  docs:[], // {id,type:'facture'|'devis'|'bl', number, status, date, dueDate, clientId, object, items:[], paymentMode, notes, avance, validity, exoRef, linkedTo}
  seq:{facture:0, devis:0, bl:0},
  suppliers:[], // {id, name, ice, address, phone, email}
  purchases:[], // status: impayee | en_attente (règlement remis) | payee (débit bancaire confirmé)
  manualVat:[], banks:[], bankServices:[], vatConfig:{year:new Date().getFullYear(),regime:'mensuel'}, vatPeriods:{}, vatBankMode:'automatique'
};
let state = load();

function load(){
  try{
    const raw = localStorage.getItem('facturis_state');
    if(!raw) return structuredClone(DEFAULT_STATE);
    return Object.assign(structuredClone(DEFAULT_STATE), JSON.parse(raw));
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
function save(){ localStorage.setItem('facturis_state', JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2400);
}
function fmt(n){ return (Math.round((n+Number.EPSILON)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(dateStart, dateEnd){
  if(!dateStart||!dateEnd) return null;
  const a=new Date(dateStart+'T00:00:00'), b=new Date(dateEnd+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function dueDaysLabel(dateStart, dateEnd){
  const n = daysBetween(dateStart, dateEnd);
  if(n===null) return '';
  if(n===0) return '(le jour même)';
  if(n>0) return `(${n} jour${n>1?'s':''})`;
  return `(échue depuis ${Math.abs(n)} jour${Math.abs(n)>1?'s':''})`;
}

/* ---- Conversion nombre → lettres (français) ---- */
const FR_UNITS=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
function frTens(n){
  if(n<20) return FR_UNITS[n];
  if(n<70){
    const t=Math.floor(n/10), u=n%10;
    const base=['','','vingt','trente','quarante','cinquante','soixante'][t];
    if(u===0) return base;
    if(u===1) return base+' et un';
    return base+'-'+FR_UNITS[u];
  }
  if(n<80){
    const u=n-60;
    if(u===11) return 'soixante et onze';
    return 'soixante-'+FR_UNITS[u];
  }
  const u=n-80;
  if(u===0) return 'quatre-vingts';
  return 'quatre-vingt-'+FR_UNITS[u];
}
function frHundreds(n){
  const c=Math.floor(n/100), r=n%100;
  let str='';
  if(c>0){ str += (c>1? FR_UNITS[c]+' cent' : 'cent'); if(c>1 && r===0) str+='s'; }
  if(r>0){ str += (str? ' ':'') + frTens(r); }
  return str||'zéro';
}
function numberToWordsFr(nInt){
  nInt=Math.round(nInt);
  if(nInt===0) return 'zéro';
  let parts=[];
  const billions=Math.floor(nInt/1e9); nInt%=1e9;
  const millions=Math.floor(nInt/1e6); nInt%=1e6;
  const thousands=Math.floor(nInt/1e3); nInt%=1e3;
  const rest=nInt;
  if(billions) parts.push(billions>1? frHundreds(billions)+' milliards' : 'un milliard');
  if(millions) parts.push(millions>1? frHundreds(millions)+' millions' : 'un million');
  if(thousands) parts.push(thousands>1? frHundreds(thousands)+' mille' : 'mille');
  if(rest) parts.push(frHundreds(rest));
  return parts.join(' ');
}
function amountToWordsMAD(amount){
  amount = Math.round((amount+Number.EPSILON)*100)/100;
  if(amount<0) amount=0;
  const intPart=Math.floor(amount);
  const cents=Math.round((amount-intPart)*100);
  let words = numberToWordsFr(intPart);
  words = words.charAt(0).toUpperCase()+words.slice(1);
  let str = words + (intPart>1? ' dirhams' : ' dirham');
  if(cents>0) str += ' et ' + numberToWordsFr(cents) + (cents>1? ' centimes':' centime');
  return str;
}

const VAT_RATES=[{v:20,l:"20 %"},{v:14,l:"14 %"},{v:10,l:"10 %"},{v:7,l:"7 %"},{v:0,l:"0 % (Exonéré)"}];
const PAYMENT_MODE_LABEL={virement:'Virement', cheque:'Chèque', especes:'Espèces', effet:'Effet de commerce', compensation:'Compensation', autre:'Autre'};
const TYPE_LABEL={facture:"Facture", devis:"Devis", bl:"Bon de livraison"};
const TYPE_PREFIX={facture:"FACT", devis:"DEV", bl:"BL"};
const STATUS_LABEL={brouillon:"Brouillon", validee:"Validée", envoyee:"Envoyée", partielle:"Partiellement réglée", payee:"Payée", en_attente:"Réglée — en attente de débit", retard:"En retard", impayee:"Impayée", annulee_avoir:"Annulée par avoir", partiel_avoir:"Partiellement annulée — reste dû"};
function isSettled(doc){ return ['payee','en_attente'].includes(doc.status); }
function settledAmount(doc,total){ return isSettled(doc) ? total : doc.status==='partielle' ? Math.min(Math.max(+doc.paidAmount||0,0),total) : 0; }
function docPaidAmount(doc){ return settledAmount(doc,computeDoc(doc).ttc); }
function purchasePaidAmount(p){ return settledAmount(p,computePurchase(p).ttc); }
function isBankCleared(doc){ return ['payee','partielle'].includes(doc.status) && !!doc.paymentDate; }
function downloadFile(name, content, mime){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:mime||'text/plain;charset=utf-8'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500); }
function csvCell(v){ return '"'+String(v??'').replace(/"/g,'""')+'"'; }
function exportCsv(name, headers, rows){ const csv='\uFEFF'+[headers,...rows].map(r=>r.map(csvCell).join(';')).join('\n'); downloadFile(name+'.csv',csv,'text/csv;charset=utf-8'); }
function exportBackup(){ downloadFile('sauvegarde-facturation-'+todayISO()+'.json',JSON.stringify(state,null,2),'application/json'); }
function importBackup(file){ const r=new FileReader(); r.onload=e=>{ try{ const data=JSON.parse(e.target.result); if(!data || !Array.isArray(data.docs) || !Array.isArray(data.clients)) throw new Error(); state=Object.assign(structuredClone(DEFAULT_STATE),data); save(); renderAll(); toast('Sauvegarde restaurée'); }catch(_){ toast('Fichier de sauvegarde invalide'); } }; r.readAsText(file); }

/* ============================= NAV ============================= */
const VIEWS=[
  {id:'dashboard', label:'Tableau de bord', icon:'▦'},
  {id:'dashboard_clients', label:'Tableau de bord clients', icon:'◍'},
  {id:'dashboard_fournisseurs', label:'Tableau de bord fournisseurs', icon:'◇'},
  {id:'tresorerie', label:'Journal de trésorerie', icon:'↕'},
  {id:'facture', label:'Factures', icon:'▤'},
  {id:'devis', label:'Devis', icon:'▥'},
  {id:'bl', label:'Bons de livraison', icon:'▧'},
  {id:'contrats', label:'Contrats & marchés', icon:'▤'},
  {id:'clients', label:'Clients', icon:'◍'},
  {id:'fournisseurs', label:'Fournisseurs', icon:'◇'},
  {id:'achats', label:'Achats', icon:'▨'},
  {id:'immobilisations', label:'Immobilisations', icon:'◫'},
  {id:'parametres', label:'Paramètres', icon:'⚙'},
];
const NAV_GROUPS=[
  {id:'ventes', label:'Client / Ventes', icon:'◍', items:[
    {id:'clients', label:'Clients'},
    {id:'facture', label:'Factures'},
    {id:'devis', label:'Devis'},
    {id:'bl', label:'Bons de livraison'},
    {id:'contrats', label:'Contrats & marchés'},
    {id:'tva', label:'TVA'},
  ]},
  {id:'achatsgrp', label:'Achat fournisseur', icon:'◇', items:[
    {id:'fournisseurs', label:'Fournisseurs'},
    {id:'achats', label:'Achats'},
    {id:'immobilisations', label:'Immobilisations'},
  ]},
  {id:'paramgrp', label:'Paramètres', icon:'⚙', items:[
    {id:'parametres', label:'Infos société'},
  ]},
];
function groupOf(viewId){ return NAV_GROUPS.find(g=>g.items.some(it=>it.id===viewId)); }
let openGroup = null;
let currentView='dashboard';
let docFilter={status:'all', client:'all', q:'', from:'', to:'', min:''};
let purchaseFilter={status:'all', supplier:'all', q:'', from:'', to:'', min:''};
const MONTH_NAMES=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
let dashPeriod={mode:'month', year:new Date().getFullYear(), month:new Date().getMonth()+1, quarter:Math.ceil((new Date().getMonth()+1)/3), semester:(new Date().getMonth()+1)<=6?1:2, from:'', to:''};
let paySort={col:'number', dir:'asc'};
let purchSort={col:'date', dir:'asc'};
let docSort={col:'date', dir:'desc'};

/* ============================= MOTEUR DE TRI GÉNÉRIQUE =============================
   Le tri ne touche JAMAIS aux données : on trie toujours une copie du tableau
   ([...liste]) et l'ordre enregistré dans state / localStorage reste identique.
   Chaque liste possède son propre état de tri {col, dir}. */
const listSort = {
  clients:   {col:'name',   dir:'asc'},
  purchases: {col:'date',   dir:'desc'},
  assets:    {col:'date',   dir:'desc'},
  contracts: {col:'number', dir:'asc'},
  clientDocs:{col:'date',   dir:'desc'},
};
function sortIndicator(view, key){
  const s=listSort[view]; if(!s||s.col!==key) return '<span style="opacity:.25;">↕</span>';
  return s.dir==='asc'?' ▲':' ▼';
}
/* Génère un en-tête de colonne cliquable (tri croissant / décroissant) */
function sortableTh(view, key, label, opts){
  opts=opts||{};
  return `<th data-lsort-view="${view}" data-lsort-col="${key}" title="Cliquer pour trier (croissant / décroissant)" style="cursor:pointer;user-select:none;${opts.num?'text-align:right;':''}${opts.style||''}">${label} ${sortIndicator(view,key)}</th>`;
}
/* Trie une COPIE de la liste : les données d'origine ne sont jamais réordonnées */
function sortList(rows, view, valueFn){
  const s=listSort[view]; if(!s) return [...rows];
  return [...rows].sort((a,b)=>{
    const av=valueFn(a,s.col), bv=valueFn(b,s.col);
    let r;
    if(typeof av==='number' && typeof bv==='number') r = (av-bv);
    else if(av==null||av==='') r = (bv==null||bv==='') ? 0 : 1;   // valeurs vides toujours en fin
    else if(bv==null||bv==='') r = -1;
    else r = String(av).localeCompare(String(bv),'fr',{numeric:true,sensitivity:'base'});
    if(r===0) return 0;
    return s.dir==='asc' ? r : -r;
  });
}
function toggleListSort(view, col){
  const s=listSort[view]; if(!s) return;
  if(s.col===col) s.dir = s.dir==='asc' ? 'desc' : 'asc';
  else { s.col=col; s.dir='asc'; }

function paymentRows(docs){

const PURCH_COLUMNS=[
  {key:'number', label:'N° Facture fournisseur'},
  {key:'supplier', label:'Fournisseur'},
  {key:'date', label:'Date facture'},
  {key:'type', label:'Type'},

  {key:'amount', label:'Montant TTC', num:true},
  {key:'status', label:'Statut'},
  {key:'paymentDate', label:'Date paiement'},
  {key:'paymentMode', label:'Mode de paiement'},
  {key:'paymentRef', label:'Référence paiement'},
];
function supplierById(id){ return state.suppliers.find(s=>s.id===id); }
/* Factures fournisseurs : une même facture peut contenir plusieurs taux de TVA
   (10 %, 20 %, exonéré). Chaque ligne de ventilation porte sa propre base HT et son taux.
   Les anciennes factures (ht + vatRate uniques) restent compatibles : elles sont lues
   comme une ventilation à une seule ligne, sans aucune modification des données. */
function purchaseVatLines(p){
  if(p && Array.isArray(p.vatLines) && p.vatLines.length){
    return p.vatLines.map(l=>({base:Number(l.base)||0, rate:Number(l.rate)||0}));
  }
  const ht = (p&&p.ht!=null) ? (Number(p.ht)||0) : (Number(p&&p.amount)||0);
  const vat = (p&&p.vatRate!=null) ? (Number(p.vatRate)||0) : 20;
  return [{base:ht, rate:vat}];
}
function computePurchase(p){
  const sign = (p&&p.nature==='avoir') ? -1 : 1;
  const lines = purchaseVatLines(p);
  let ht=0, tva=0; const byRate={};
  lines.forEach(l=>{ ht+=l.base; tva+=l.base*(l.rate/100); byRate[l.rate]=(byRate[l.rate]||0)+l.base; });
  const breakdown = Object.entries(byRate)
    .map(([rate,base])=>({rate:Number(rate), base:base*sign, amt:base*sign*(Number(rate)/100)}))
    .sort((a,b)=>b.rate-a.rate);
  const ht2 = ht*sign, tva2 = tva*sign;
  const dominant = breakdown.length ? breakdown.reduce((a,b)=>Math.abs(b.base)>Math.abs(a.base)?b:a).rate : 0;
  return {ht:ht2, tva:tva2, ttc:ht2+tva2, vatRate:dominant, rates:breakdown.map(b=>b.rate), breakdown, sign};
}
function purchaseRatesLabel(p){
  const b=computePurchase(p).breakdown;
  if(!b.length) return '—';
  return b.map(x=>x.rate===0?'Exonéré':x.rate+' %').join(' + ');
}
function relatedNetAfterAvoirPurchase(avoirP){
  if(!avoirP || avoirP.nature!=='avoir' || !avoirP.linkedPurchaseId) return null;

  if(!orig) return null;
  const origT=computePurchase(orig), avT=computePurchase(avoirP);
  return {orig, origTtc:origT.ttc, avoirTtc:avT.ttc, net: origT.ttc+avT.ttc};
}
const PURCH_TYPE_LABEL={charge:'Charge', immobilisation:'Immobilisation'};

      ht:t.ht, amount:t.ttc, status:STATUS_LABEL[p.status]||p.status, statusRaw:p.status,

    };

/* ---- Amortissement des immobilisations (prorata temporis mensuel) ---- */
function monthlyDepreciation(p){
  if(p.type!=='immobilisation') return 0;
  const ht = computePurchase(p).ht;
  const duree = p.dureeAns || 5;
  return ht/duree/12;
}
function parseYM(dateStr){ const [y,m]=dateStr.split('-').map(Number); return {y,m}; }
function isMonthAmortized(p, y, m){
  const start = parseYM(p.date);
  const startIdx = start.y*12 + (start.m-1);
  const idx = y*12 + (m-1);
  const totalMonths = (p.dureeAns||5)*12;
  const diff = idx - startIdx;
  if(diff<0 || diff>=totalMonths) return false;
  if(p.saleDate){ const sale=parseYM(p.saleDate); const saleIdx=sale.y*12+(sale.m-1); if(idx>saleIdx) return false; }
  return true;
}
function depreciationInRange(p, range){
  const s=parseYM(range.start), e=parseYM(range.end);
  let total=0, y=s.y, m=s.m;
  while(y<e.y || (y===e.y && m<=e.m)){
    if(isMonthAmortized(p,y,m)) total += monthlyDepreciation(p);
    m++; if(m>12){m=1;y++;}
  }
  return total;
}
function assetSchedule(p){
  const startYear=+p.date.slice(0,4), endByLife=startYear+(p.dureeAns||5)+1, endYear=p.saleDate?+p.saleDate.slice(0,4):endByLife;
  const rows=[]; let cumul=0, base=computePurchase(p).ht;
  for(let y=startYear;y<=endYear;y++){ let dot=Math.min(depreciationInRange(p,{start:`${y}-01-01`,end:`${y}-12-31`}),Math.max(0,base-cumul)); if(dot||y===startYear){cumul+=dot;rows.push({year:y,base:Math.max(0,base-(cumul-dot)),dot,cumul,vnc:Math.max(0,base-cumul)});} }
  return rows;
}
function sortRows(rows, sortState){
  sortState = sortState || paySort;
  const col=sortState.col, dir=sortState.dir==='asc'?1:-1;
  return [...rows].sort((a,b)=>{
    let av=col==='tauxTva'?a.tauxTvaSort:a[col], bv=col==='tauxTva'?b.tauxTvaSort:b[col];
    if(typeof av==='string') av=av.toLowerCase();
    if(typeof bv==='string') bv=bv.toLowerCase();
    if(av<bv) return -1*dir;
    if(av>bv) return 1*dir;
    return 0;
  });
}

function periodRange(){
  if(dashPeriod.mode==='all'){
    return {start:'0001-01-01', end:'9999-12-31'};
  }
  if(dashPeriod.mode==='year'){
    const y=dashPeriod.year;
    return {start:`${y}-01-01`, end:`${y}-12-31`};
  }
  if(dashPeriod.mode==='semester'){
    const y=dashPeriod.year, s=dashPeriod.semester;
    const startM = s===1?1:7, endM = s===1?6:12;
    const lastDay = new Date(y,endM,0).getDate();
    return {start:`${y}-${String(startM).padStart(2,'0')}-01`, end:`${y}-${String(endM).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`};
  }
  if(dashPeriod.mode==='quarter'){
    const y=dashPeriod.year, q=dashPeriod.quarter;
    const startM=(q-1)*3+1, endM=q*3;
    const lastDay=new Date(y,endM,0).getDate();
    return {start:`${y}-${String(startM).padStart(2,'0')}-01`, end:`${y}-${String(endM).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`};
  }
  if(dashPeriod.mode==='custom'){
    return {start: dashPeriod.from || '0001-01-01', end: dashPeriod.to || '9999-12-31'};
  }
  const y=dashPeriod.year, m=dashPeriod.month;
  const start=`${y}-${String(m).padStart(2,'0')}-01`;
  const lastDay=new Date(y,m,0).getDate();
  const end=`${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return {start, end};
}
function inRange(dateStr, range){ return dateStr>=range.start && dateStr<=range.end; }
function periodLabel(){
  if(dashPeriod.mode==='all') return 'Tout le temps';
  if(dashPeriod.mode==='year') return `Année ${dashPeriod.year}`;
  if(dashPeriod.mode==='semester') return `S${dashPeriod.semester} ${dashPeriod.year}`;
  if(dashPeriod.mode==='quarter') return `T${dashPeriod.quarter} ${dashPeriod.year}`;
  if(dashPeriod.mode==='custom') return `${dashPeriod.from||'…'} → ${dashPeriod.to||'…'}`;
  return `${MONTH_NAMES[dashPeriod.month-1]} ${dashPeriod.year}`;
}
function yearsInData(){
  const ys=new Set([new Date().getFullYear()]);
  state.docs.forEach(d=>{ if(d.date) ys.add(+d.date.slice(0,4)); });
  state.purchases.forEach(p=>{ if(p.date) ys.add(+p.date.slice(0,4)); });
  return [...ys].sort((a,b)=>b-a);
}

/* ============================= HELPERS ============================= */
function clientById(id){ return state.clients.find(c=>c.id===id); }
/* Taux de TVA d'une ligne : chaque ligne porte son propre taux (10 %, 20 %, exonéré 0 %…).
   Une valeur absente ou invalide est traitée comme 0 % (exonéré) plutôt que d'être ignorée. */
function lineVatRate(it){ const v=Number(it&&it.vat); return Number.isFinite(v)? v : 0; }
function lineHtAmount(it){ return (Number(it.qty)||0)*(Number(it.price)||0)*(1-(Number(it.discount)||0)/100); }
function lineVatAmount(it){ return lineHtAmount(it)*(lineVatRate(it)/100); }
function lineTtcAmount(it){ return lineHtAmount(it)+lineVatAmount(it); }
function computeDoc(doc){
  let ht=0, byRate={};
  (doc.items||[]).forEach(it=>{
    const lineHt = lineHtAmount(it);
    ht+=lineHt;
    const key=lineVatRate(it);
    byRate[key]=(byRate[key]||0)+lineHt;
  });
  let tva=0;
  let breakdown=Object.entries(byRate).map(([rate,base])=>{
    const amt = base*(Number(rate)/100);
    tva+=amt;
    return {rate:Number(rate), base, amt};
  }).sort((a,b)=>b.rate-a.rate);
  const sign = doc.nature==='avoir' ? -1 : 1;
  const ht2 = ht*sign, tva2 = tva*sign;
  const ttc = ht2+tva2;
  breakdown = breakdown.map(b=>({rate:b.rate, base:b.base*sign, amt:b.amt*sign}));
  const avance = doc.avance||0;
  const net = avance>0 ? (ttc-avance) : ttc;
  return {ht:ht2, tva:tva2, ttc, avance, net, breakdown, sign};
}
function relatedNetAfterAvoir(avoirDoc){
  if(!avoirDoc || avoirDoc.nature!=='avoir' || !avoirDoc.linkedInvoiceId) return null;
  const orig = state.docs.find(d=>d.id===avoirDoc.linkedInvoiceId);
  if(!orig) return null;
  const origT=computeDoc(orig), avT=computeDoc(avoirDoc);
  return {orig, origTtc:origT.ttc, avoirTtc:avT.ttc, net: origT.ttc+avT.ttc};
}
/* RÈGLE : pas de date d'échéance = aucune échéance = aucun retard.
   Aucune comparaison avec la date du jour n'est effectuée si la date d'échéance est vide. */
function hasDueDate(doc){ return !!(doc && typeof doc.dueDate==='string' && doc.dueDate.trim()!==''); }
function isOverdue(doc){
  if(!hasDueDate(doc)) return false;              // aucune échéance renseignée → jamais en retard
  if(isSettled(doc)) return false;
  if(!['envoyee','validee'].includes(doc.status)) return false;
  if(docRemaining(doc)<=0.005) return false;      // soldée par avoirs et/ou paiements → pas de retard
  return doc.dueDate.trim() < todayISO();
}
/* Solde réel d'une facture = TTC − avoirs imputés − paiements. Le montant TTC d'origine n'est jamais modifié. */
function docRemaining(doc){
  if(!doc || doc.type!=='facture' || (doc.nature||'doit')==='avoir') return 0;
  const ttc=computeDoc(doc).ttc;
  return Math.max(0, ttc - docAppliedAvoir(doc.id) - docPaidAmount(doc));
}
function effectiveStatus(doc){
  if(doc && doc.type==='facture' && (doc.nature||'doit')!=='avoir' && doc.status!=='brouillon'){
    const ttc=computeDoc(doc).ttc;
    const avoir=docAppliedAvoir(doc.id);
    const paid=docPaidAmount(doc);
    const remain=Math.max(0, ttc-avoir-paid);
    if(avoir>0.005){
      if(remain<=0.005) return avoir>=ttc-0.005 ? 'annulee_avoir' : 'payee';
      return 'partiel_avoir';
    }
    if(ttc>0.005 && remain<=0.005 && paid>0.005 && !isSettled(doc)) return 'payee';
  }
  return isOverdue(doc) ? 'retard' : doc.status;
}
function badge(doc){ const s=effectiveStatus(doc); return `<span class="badge badge-${s}">${STATUS_LABEL[s]}</span>`; }

/* ============================= RÉSULTAT (bénéfice / déficit) ============================= */
function viewResultat(){
  const range = periodRange();

  const facturesAll = state.docs.filter(d=>d.type==='facture' && d.status!=='brouillon');
  const facturesPeriod = facturesAll.filter(d=>inRange(d.date, range));
  const ventesHT = facturesPeriod.reduce((s,d)=>s+computeDoc(d).ht,0);

  const chargeAchats = state.purchases.filter(p=>(p.type||'charge')==='charge' && inRange(p.date, range));
  const totalChargesDirectes = chargeAchats.reduce((s,p)=>s+computePurchase(p).ht,0);

  const immobilisations = state.purchases.filter(p=>p.type==='immobilisation');
  const dotations = immobilisations.map(p=>({p, montant: depreciationInRange(p, range)})).filter(x=>x.montant>0);
  const totalDotations = dotations.reduce((s,x)=>s+x.montant,0);

  const totalCharges = totalChargesDirectes + totalDotations;
  const resultat = ventesHT - totalCharges;
  const isBenefice = resultat>=0;

  return `
  <div class="topbar">
    <div><h2>Résultat</h2><p>Bénéfice ou déficit sur la période — ventes HT moins charges (dont amortissement au prorata des immobilisations)</p></div>

    <div class="stat"><div class="label">Total ventes (HT)</div><div class="value">${fmt(ventesHT)} MAD</div><div class="sub">${periodLabel()} · ${facturesPeriod.length} facture(s)</div></div>
    <div class="stat"><div class="label">Charges directes (HT)</div><div class="value" style="color:var(--gold)">${fmt(totalChargesDirectes)} MAD</div><div class="sub">${chargeAchats.length} achat(s) — hors immobilisations</div></div>
    <div class="stat"><div class="label">Dotations aux amortissements</div><div class="value" style="color:var(--gold)">${fmt(totalDotations)} MAD</div><div class="sub">quote-part de la période, prorata temporis</div></div>
    <div class="stat"><div class="label">${isBenefice?'Bénéfice':'Déficit'}</div><div class="value" style="color:${isBenefice?'var(--ok)':'var(--danger)'}">${fmt(Math.abs(resultat))} MAD</div><div class="sub">Ventes HT − Charges totales (${fmt(totalCharges)} MAD)</div></div>
  </div>

  <div class="card">
    <h3 style="font-size:16px;margin-bottom:12px;">Charges directes — ${periodLabel()}</h3>
    ${chargeAchats.length? `<table><thead><tr><th>N° facture fournisseur</th><th>Fournisseur</th><th>Date</th><th class="num">Montant HT</th></tr></thead><tbody>
      ${chargeAchats.map(p=>{const s=supplierById(p.supplierId); return `<tr><td class="mono">${esc(p.number)||'—'}</td><td>${s?esc(s.name):'—'}</td><td>${p.date}</td><td class="num" style="text-align:right">${fmt(computePurchase(p).ht)} MAD</td></tr>`}).join('')}
    </tbody></table>` : `<div class="empty">Aucune charge directe sur cette période.</div>`}
  </div>

  <div class="card">

/* ===== AJOUT — TVA par ventilation de paiement =====
   Ajout pur : aucune donnée existante n'est modifiée, supprimée ni recalculée.
   HT = TTC / (1 + taux)   ·   TVA = TTC − HT                                   */
let draftDocPaymentRate=null;         // taux TVA de la ligne de paiement d'origine (facture client)
let draftPurchasePaymentRate=null;    // idem pour une facture fournisseur
function paymentSplitOf(amount, rate){
  const t=Number(amount)||0, r=Number(rate)||0;
  const ht = t/(1+r/100);
  return {ttc:t, rate:r, ht, tva:t-ht};
}
function effVatRate(rates, v){ return (v!==null && v!==undefined && v!=='') ? Number(v) : (rates && rates.length ? Number(rates[0]) : 0); }
function rateLabel(r){ return Number(r)===0 ? '0 % (Exonéré)' : (Number(r)+' %'); }
function docDraftRates(){ const s=[...new Set((draftItems||[]).map(it=>lineVatRate(it)))].sort((a,b)=>b-a); return s.length? s : [0]; }
function purchaseDraftRates(){ const s=[...new Set((draftPurchaseVatLines||[]).map(l=>Number(l.rate)||0))].sort((a,b)=>b-a); return s.length? s : [0]; }
/* Un seul taux sur la facture → taux repris automatiquement et non modifiable.
   Plusieurs taux → sélection du taux applicable au paiement. */
function vatRateControlHtml(rates, cur, cls){
  const r=effVatRate(rates,cur);
  if(rates.length<=1) return `<input type="hidden" class="${cls}" value="${rates[0]||0}"><span class="mono" style="font-size:12.5px;">${rateLabel(rates[0]||0)}</span>`;
  return `<select class="${cls}">${rates.map(x=>`<option value="${x}" ${x===r?'selected':''}>${rateLabel(x)}</option>`).join('')}</select>`;
}
function paymentVatCellsHtml(rates, amount, rate, cls){
  const sp=paymentSplitOf(amount, effVatRate(rates, rate));
  return `<td>${vatRateControlHtml(rates, rate, cls+'-vat')}</td>`
    + `<td class="num ${cls}-ht" style="text-align:right;white-space:nowrap;">${fmt(sp.ht)}</td>`
    + `<td class="num ${cls}-tva" style="text-align:right;white-space:nowrap;">${fmt(sp.tva)}</td>`;
}

/* Ventilations de paiement d'un document (ligne d'origine + lignes ajoutées).
   Retourne null si aucun taux n'a été saisi sur les paiements : dans ce cas
   l'état de TVA conserve exactement son comportement historique. */
function paymentVatSplits(o, paidTotal){
  const extras=(o.extraPayments||[]).map(x=>({
    ttc:Number(x.amount)||0,
    rate:(x.vatRate!==undefined&&x.vatRate!==null&&x.vatRate!=='')?Number(x.vatRate):null,
    date:x.date||o.paymentDate||'', mode:x.mode||o.paymentMode||'', ref:x.ref||''
  }));
  const extrasSum=extras.reduce((n,x)=>n+x.ttc,0);
  const mainRate=(o.paymentVatRate!==undefined&&o.paymentVatRate!==null&&o.paymentVatRate!=='')?Number(o.paymentVatRate):null;
  const main={ttc:(Number(paidTotal)||0)-extrasSum, rate:mainRate, date:o.paymentDate||'', mode:o.paymentMode||'', ref:o.paymentRef||''};
  const all=[main,...extras].filter(x=>Math.abs(x.ttc)>0.0001);
  if(!all.length) return null;
  if(!all.some(x=>x.rate!==null)) return null;
  return all;
}
/* 1 ventilation de paiement + 1 taux = 1 ligne. Aucune fusion de taux. */
function expandPaymentSplit(sp, t){
  if(sp.rate!==null && sp.rate!==undefined && sp.rate!==''){ return [paymentSplitOf(sp.ttc, sp.rate)]; }
  const bd=(t.breakdown||[]).filter(b=>Math.abs(b.base)>0.0001);
  if(!bd.length) return [paymentSplitOf(sp.ttc, 0)];
  if(bd.length===1) return [paymentSplitOf(sp.ttc, bd[0].rate)];
  const totTtc=bd.reduce((n,b)=>n+b.base+b.amt,0);
  if(!totTtc) return [paymentSplitOf(sp.ttc, 0)];
  return bd.map(b=>paymentSplitOf(sp.ttc*((b.base+b.amt)/totTtc), b.rate));
}

/* ============================= DÉCLARATION DE TVA ============================= */
/* Régime encaissement : TVA facturée exigible à l'encaissement, TVA récupérable déductible au paiement.
   La déclaration d'une écriture peut être décalée sur un autre trimestre (report) via la case à cocher. */
function tvaKeyOf(range){ return range.start+'→'+range.end; }
function monthRangeOf(y,m){ const last=new Date(y,m,0).getDate(); return {start:`${y}-${String(m).padStart(2,'0')}-01`, end:`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`}; }
function quarterRangeOf(y,q){ const last=new Date(y,q*3,0).getDate(); return {start:`${y}-${String((q-1)*3+1).padStart(2,'0')}-01`, end:`${y}-${String(q*3).padStart(2,'0')}-${String(last).padStart(2,'0')}`}; }
// Liste des périodes de déclaration proposées (trimestres et mois)
function tvaPeriodOptions(){
  const cy=new Date().getFullYear();
  const years=[...new Set([cy+1,cy,cy-1,...yearsInData()])].sort((a,b)=>b-a);
  const opts=[];
  years.forEach(y=>{
    for(let q=1;q<=4;q++){ const r=quarterRangeOf(y,q); opts.push({key:tvaKeyOf(r), label:`T${q} ${y} — trimestre`}); }
    for(let m=1;m<=12;m++){ const r=monthRangeOf(y,m); opts.push({key:tvaKeyOf(r), label:`${MONTH_NAMES[m-1]} ${y} — mois`}); }
  });
  return opts;
}
function tvaPeriodLabelOf(key){ if(!key||key==='reporte') return ''; const o=tvaPeriodOptions().find(o=>o.key===key); return o? o.label : key.replace('→',' → '); }
function tvaPeriodSelectHtml(kind, id, decl, curKey){
  const opts=tvaPeriodOptions();
  const known = opts.some(o=>o.key===decl);
  return `<select data-tva-period="${id}" data-tva-kind="${kind}" style="max-width:190px;padding:4px 6px;font-size:12.5px;">
    <option value="" ${!decl?'selected':''}>Auto (date de paiement)</option>
    <option value="reporte" ${decl==='reporte'?'selected':''}>Reporter — non déclarée</option>
    <option value="${curKey}" ${decl===curKey?'selected':''}>Période affichée (${periodLabel()})</option>
    ${(!known&&decl&&decl!=='reporte'&&decl!==curKey)?`<option value="${decl}" selected>${tvaPeriodLabelOf(decl)}</option>`:''}
    ${opts.filter(o=>o.key!==curKey).map(o=>`<option value="${o.key}" ${decl===o.key?'selected':''}>${o.label}</option>`).join('')}
  </select>`;
}
function tvaCollection(kind){ return kind==='sale' ? state.docs : kind==='manual' ? (state.manualVat=state.manualVat||[]) : state.purchases; }
// Lignes de TVA récupérable saisies manuellement (charges bancaires, etc.)
function tvaManualRows(){
  return (state.manualVat||[]).map(e=>({
    id:e.id, payDate:e.date, label:e.ref||'Saisie manuelle', party:e.label||'Charges bancaires',
    base:+e.base||0, tva:+e.tva||0, ttc:(+e.base||0)+(+e.tva||0), decl:e.tvaDecl
  })).filter(r=>Math.abs(r.tva)>0.0001);
}

// Lignes de ventes éligibles (factures encaissées) avec part HT/TVA proportionnelle à l'encaissement
function tvaSaleRows(){
  const out=[];
  state.docs.filter(d=>d.type==='facture' && isBankCleared(d) && d.paymentDate).forEach(d=>{
    const t=computeDoc(d); const enc=docPaidAmount(d); const ratio=t.ttc? enc/t.ttc:0;
    const party=(clientById(d.clientId)||{}).name||'—';
    const splits=paymentVatSplits(d, enc);
    if(!splits){ // aucune TVA saisie sur les paiements → comportement historique inchangé
      out.push({id:d.id, payDate:d.paymentDate, label:d.number||'—', party, base:t.ht*ratio, tva:t.tva*ratio, ttc:enc, decl:d.tvaDecl, pmode:d.paymentMode||'', rate:(t.breakdown.length===1?t.breakdown[0].rate:null)});
      return;
    }
    splits.forEach(sp=>{
      expandPaymentSplit(sp, t).forEach(x=>{
        out.push({id:d.id, payDate:sp.date||d.paymentDate, label:d.number||'—', party, base:x.ht, tva:x.tva, ttc:x.ttc, decl:d.tvaDecl, pmode:sp.mode||d.paymentMode||'', rate:x.rate});
      });
    });
  });
  return out.filter(r=>Math.abs(r.ttc)>0.0001);
}
// Lignes d'achats éligibles (factures fournisseurs payées) — récupérable seulement si TVA présente
function tvaPurchaseRows(){
  const out=[];
  state.purchases.filter(p=>isBankCleared(p) && p.paymentDate).forEach(p=>{
    const t=computePurchase(p); const paid=purchasePaidAmount(p); const ratio=t.ttc? paid/t.ttc:0;
    const party=(supplierById(p.supplierId)||{}).name||'—';
    const modeLabel=m=>m?(PAYMENT_MODE_LABEL[m]||m):'';
    const splits=paymentVatSplits(p, paid);
    if(!splits){ // aucune TVA saisie sur les paiements → comportement historique inchangé
      out.push({id:p.id, payDate:p.paymentDate, label:p.number||'(sans facture)', party, base:t.ht*ratio, tva:t.tva*ratio, ttc:paid, decl:p.tvaDecl, pmode:modeLabel(p.paymentMode), rate:(t.breakdown.length===1?t.breakdown[0].rate:null)});
      return;
    }
    splits.forEach(sp=>{
      expandPaymentSplit(sp, t).forEach(x=>{
        out.push({id:p.id, payDate:sp.date||p.paymentDate, label:p.number||'(sans facture)', party, base:x.ht, tva:x.tva, ttc:x.ttc, decl:p.tvaDecl, pmode:modeLabel(sp.mode||p.paymentMode), rate:x.rate});
      });
    });
  });
  return out.filter(r=>Math.abs(r.tva)>0.0001);
}
// Classe chaque ligne : incluse dans la déclaration de la période, ou disponible (reportée / arriéré non déclaré)
function tvaClassify(rows, range){
  const key=tvaKeyOf(range); const included=[], available=[];
  rows.forEach(r=>{
    const decl=r.decl; const naturallyIn=inRange(r.payDate, range);
    if(decl===key || (decl==null && naturallyIn)){ included.push(r); return; }
    if(decl && decl!=='reporte' && decl!==key){ available.push(r); return; } // déclarée sur une autre période
    if(decl==='reporte' || (decl==null && !naturallyIn)) available.push(r);
  });
  return {key, included, available};
}
function tvaSectionTable(cls, kind, range){
  const all=[...cls.included.map(r=>({r,inc:true})), ...cls.available.map(r=>({r,inc:false}))];
  all.sort((a,b)=>(a.r.payDate||'').localeCompare(b.r.payDate||''));
  if(!all.length) return `<div class="empty">Aucune écriture éligible sur cette période ni en report.</div>`;
  const curKey=tvaKeyOf(range);
  return `<table><thead><tr><th style="width:70px;">Déclarer</th><th>N°</th><th>${kind==='sale'?'Client':kind==='manual'?'Libellé':'Fournisseur'}</th><th>Date paiement</th><th style="width:200px;">Déclarée en</th><th class="num">Base HT</th><th class="num">TVA</th>${kind==='manual'?'<th></th>':''}</tr></thead><tbody>
    ${all.map(({r,inc})=>{
      const late = !inRange(r.payDate, range);
      const elsewhere = r.decl && r.decl!=='reporte' && r.decl!==curKey;
      const hint = elsewhere ? `<span class="badge" style="background:var(--gold-soft);color:#72520D;margin-left:6px;">déclarée en ${tvaPeriodLabelOf(r.decl)}</span>`
        : late ? `<span class="badge" style="background:var(--gold-soft);color:#72520D;margin-left:6px;">report d'une autre période</span>`
        : (r.decl==='reporte' ? `<span class="badge" style="background:#F5DAD3;color:var(--danger);margin-left:6px;">reportée</span>` : '');
      return `<tr style="${inc?'':'opacity:.72;'}">
        <td><input type="checkbox" data-tva-toggle="${r.id}" data-tva-kind="${kind}" ${inc?'checked':''} style="width:17px;height:17px;cursor:pointer;"></td>
        <td class="mono">${esc(r.label)}${hint}</td>
        <td>${esc(r.party)}</td>
        <td>${r.payDate}</td>
        <td>${tvaPeriodSelectHtml(kind, r.id, r.decl, curKey)}</td>
        <td class="num" style="text-align:right">${fmt(r.base)} MAD</td>
        <td class="num" style="text-align:right;font-weight:600">${fmt(r.tva)} MAD</td>
        ${kind==='manual'?`<td style="white-space:nowrap;"><button class="btn btn-ghost" data-edit-mvat="${r.id}" style="padding:3px 8px;font-size:12px;">Modifier</button> <button class="btn btn-ghost" data-del-mvat="${r.id}" style="padding:3px 8px;font-size:12px;color:var(--danger)">Suppr.</button></td>`:''}
      </tr>`;
    }).join('')}
  </tbody></table>`;
}

          <input type="number" min="0" step="any" id="tva_credit" value="${creditReporte||''}" placeholder="0" style="width:120px;padding:4px 8px;"></td>

  openModal(e?'Modifier — TVA récupérable manuelle':'TVA récupérable manuelle', manualVatForm(e), [
    {label:'Annuler', cls:'btn-ghost', action:closeModal},
    {label:e?'Enregistrer':'Ajouter', cls:'btn-primary', action:()=>{
      const date=document.getElementById('mv_date').value;
      const label=document.getElementById('mv_label').value.trim();
      const tva=parseFloat(document.getElementById('mv_tva').value)||0;
      if(!date){ toast('Indiquez la date'); return; }
      if(!label){ toast('Indiquez un libellé'); return; }
      if(!tva){ toast('Indiquez un montant de TVA'); return; }
      const data={date, label, ref:document.getElementById('mv_ref').value.trim(), base:parseFloat(document.getElementById('mv_base').value)||0, tva};
      if(e) Object.assign(e,data); else state.manualVat.push({id:uid(), tvaDecl:null, ...data});
      save(); closeModal(); renderAll(); toast('TVA récupérable enregistrée');
    }}
  ]);
}

  const paid = paidDocsPeriod.reduce((s,d)=>s+computeDoc(d).ttc,0);

  // global (non period-scoped) account status — solde = TTC − avoirs imputés − paiements
  const facturesDoit = facturesAll.filter(d=>(d.nature||'doit')!=='avoir');
  const dueGlobal = facturesDoit.reduce((s,d)=>s+docRemaining(d),0);
  const overdue = facturesDoit.filter(isOverdue);
  const overdueAmt = overdue.reduce((s,d)=>s+docRemaining(d),0);

  // client recap (global, all-time)
  const byClient={};

    if(!byClient[key]) byClient[key]={name:c?c.name:'Client supprimé', ttc:0, paid:0, avoir:0, remain:0};

    byClient[key].ttc+=t.ttc;

    byClient[key].avoir+=docAppliedAvoir(d.id);
    byClient[key].remain+=docRemaining(d);

    bySupplier[key].total+=pt.ttc;

    ${recent.map(d=>{const c=clientById(d.clientId); return `<tr><td>${TYPE_LABEL[d.type]}</td><td class="mono">${d.number||'—'}</td><td>${c?c.name:'—'}</td><td>${d.date}</td><td>${badge(d)}</td><td class="num" style="text-align:right">${fmt(computeDoc(d).ttc)} MAD</td></tr>`}).join('')}

function viewTreasury(){
  const range=periodRange();
  const entries=[];
  state.docs.filter(d=>d.type==='facture' && isBankCleared(d) && inRange(d.paymentDate,range)).forEach(d=>entries.push({date:d.paymentDate,nature:'Encaissement client',party:clientById(d.clientId)?.name||'Client',ref:d.paymentRef||d.number,amount:docPaidAmount(d),side:'in'}));
  state.purchases.filter(p=>isBankCleared(p) && inRange(p.paymentDate,range)).forEach(p=>entries.push({date:p.paymentDate,nature:'Décaissement fournisseur',party:supplierById(p.supplierId)?.name||'Fournisseur',ref:p.noInvoice?('Sans facture'+(p.paymentRef?' — '+p.paymentRef:'')):(p.paymentRef||p.number),amount:purchasePaidAmount(p),side:'out'}));
  entries.sort((a,b)=>a.date.localeCompare(b.date));
  const incoming=entries.filter(e=>e.side==='in').reduce((s,e)=>s+e.amount,0), outgoing=entries.filter(e=>e.side==='out').reduce((s,e)=>s+e.amount,0);
  const forecast=[];
  state.docs.filter(d=>d.type==='facture'&&(d.nature||'doit')!=='avoir'&&!isSettled(d)&&hasDueDate(d)&&docRemaining(d)>0.005).forEach(d=>forecast.push({date:d.dueDate,nature:'Encaissement attendu',party:clientById(d.clientId)?.name||'Client',amount:docRemaining(d),side:'in'}));
  state.purchases.filter(p=>!isSettled(p)&&p.dueDate).forEach(p=>forecast.push({date:p.dueDate,nature:'Décaissement prévu',party:supplierById(p.supplierId)?.name||'Fournisseur',amount:computePurchase(p).ttc-purchasePaidAmount(p),side:'out'}));
  forecast.sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="topbar"><div><h2>Journal de trésorerie</h2><p>Opérations réellement visibles sur le relevé bancaire</p></div><div style="display:flex;gap:8px;"><button class="btn btn-ghost" id="btnExportCash">Exporter Excel (CSV)</button><button class="btn btn-ghost" id="btnPrintCash">Imprimer / PDF</button></div></div>
  ${periodSelectorHtml()}<div class="grid-4"><div class="stat"><div class="label">Encaissements</div><div class="value" style="color:var(--ok)">${fmt(incoming)} MAD</div><div class="sub">${periodLabel()}</div></div><div class="stat"><div class="label">Décaissements</div><div class="value" style="color:var(--danger)">${fmt(outgoing)} MAD</div><div class="sub">${periodLabel()}</div></div><div class="stat"><div class="label">Flux net</div><div class="value" style="color:${incoming-outgoing>=0?'var(--ok)':'var(--danger)'}">${fmt(incoming-outgoing)} MAD</div><div class="sub">encaissements − décaissements</div></div><div class="stat"><div class="label">Opérations</div><div class="value">${entries.length}</div><div class="sub">débits confirmés</div></div></div>
  <div class="card" id="cashPrint"><h3 style="font-size:16px;margin-bottom:12px;">Mouvements bancaires</h3>${entries.length?`<table><thead><tr><th>Date</th><th>Nature</th><th>Tiers</th><th>Référence</th><th class="num">Encaissement</th><th class="num">Décaissement</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${e.date}</td><td>${e.nature}</td><td>${esc(e.party)}</td><td>${esc(e.ref)}</td><td class="num" style="text-align:right;color:var(--ok)">${e.side==='in'?fmt(e.amount)+' MAD':'—'}</td><td class="num" style="text-align:right;color:var(--danger)">${e.side==='out'?fmt(e.amount)+' MAD':'—'}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Aucun mouvement bancaire pour cette période.</div>`}</div>
  <div class="card"><h3 style="font-size:16px;margin-bottom:12px;">Échéancier prévisionnel</h3>${forecast.length?`<table><thead><tr><th>Date prévue</th><th>Nature</th><th>Tiers</th><th class="num">Montant</th></tr></thead><tbody>${forecast.map(e=>`<tr><td>${e.date}</td><td>${e.nature}</td><td>${esc(e.party)}</td><td class="num" style="text-align:right;color:${e.side==='in'?'var(--ok)':'var(--danger)'}">${fmt(e.amount)} MAD</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Ajoutez les dates d’échéance des factures et les dates prévues de paiement des achats pour afficher les prévisions.</div>`}</div>`;
}

function clientSortValue(c, col){
  const docs=state.docs.filter(d=>d.type==='facture' && (d.nature||'doit')!=='avoir' && d.clientId===c.id);
  if(col==='ttc')    return docs.reduce((s,d)=>s+computeDoc(d).ttc,0);
  if(col==='paid')   return docs.reduce((s,d)=>s+docPaidAmount(d),0);
  if(col==='avoir')  return docs.reduce((s,d)=>s+docAppliedAvoir(d.id),0);
  if(col==='remain') return docs.reduce((s,d)=>s+docRemaining(d),0);
  if(col==='count')  return docs.length;
  if(col==='address')return (c.address||'').toLowerCase();
  return (c[col]||'').toString().toLowerCase();
}

/* ============================= ACHATS (factures fournisseurs saisies) ============================= */
/* Valeurs de tri de la liste des achats (affichage uniquement) */
function purchaseSortValue(p, col){
  const t=computePurchase(p);
  if(col==='ht')       return t.ht;
  if(col==='tva')      return t.tva;
  if(col==='ttc')      return t.ttc;
  if(col==='paid')     return purchasePaidAmount(p);
  if(col==='remain')   return t.ttc-purchasePaidAmount(p);
  if(col==='supplier') return (supplierById(p.supplierId)?.name||'').toLowerCase();
  if(col==='status')   return (STATUS_LABEL[p.status]||p.status||'').toLowerCase();
  if(col==='type')     return (PURCH_TYPE_LABEL[p.type]||'Charge').toLowerCase();

}

/* ---- Ventilation TVA multi-taux des factures fournisseurs (saisie) ---- */
let draftPurchaseVatLines=[];
let draftPurchaseExtraPayments=[]; // paiements supplémentaires (au-delà de la ligne existante) pour une facture fournisseur
function purchaseDraftTotals(){
  let ht=0, tva=0;
  draftPurchaseVatLines.forEach(l=>{ const b=Number(l.base)||0, r=Number(l.rate)||0; ht+=b; tva+=b*(r/100); });
  return {ht, tva, ttc:ht+tva};
}
function renderPurchaseVatLines(){
  const body=document.getElementById('pfVatBody');
  if(!body) return;
  body.innerHTML = draftPurchaseVatLines.map((l,idx)=>{
    const base=Number(l.base)||0, rate=Number(l.rate)||0;
    return `<tr data-vidx="${idx}">
      <td><input type="number" min="0" step="any" class="pv-base" value="${base}" style="width:100%"></td>
      <td><select class="pv-rate">${VAT_RATES.map(r=>`<option value="${r.v}" ${rate==r.v?'selected':''}>${r.l}</option>`).join('')}</select></td>
      <td class="num pv-tva" style="text-align:right;white-space:nowrap;">${fmt(base*rate/100)}</td>
      <td class="num pv-ttc" style="text-align:right;white-space:nowrap;">${fmt(base*(1+rate/100))}</td>
      <td class="line-actions"><button type="button" class="btn btn-danger btn-sm pv-del" title="Supprimer">✕</button></td>
    </tr>`;
  }).join('');
  body.querySelectorAll('tr').forEach(row=>{
    const idx=+row.dataset.vidx;
    row.querySelector('.pv-base').oninput=e=>{ draftPurchaseVatLines[idx].base=parseFloat(e.target.value)||0; refreshPurchaseVatTotals(); };
    row.querySelector('.pv-rate').onchange=e=>{ draftPurchaseVatLines[idx].rate=+e.target.value; refreshPurchaseVatTotals(); };
    row.querySelector('.pv-del').onclick=()=>{ draftPurchaseVatLines.splice(idx,1); if(!draftPurchaseVatLines.length) draftPurchaseVatLines.push({base:0,rate:20}); renderPurchaseVatLines(); };
  });
  refreshPurchaseVatTotals();
}
function refreshPurchaseVatTotals(){
  const body=document.getElementById('pfVatBody');
  if(body){
    body.querySelectorAll('tr').forEach(row=>{
      const l=draftPurchaseVatLines[+row.dataset.vidx]; if(!l) return;
      const base=Number(l.base)||0, rate=Number(l.rate)||0;
      const tvaCell=row.querySelector('.pv-tva'), ttcCell=row.querySelector('.pv-ttc');
      if(tvaCell) tvaCell.textContent=fmt(base*rate/100);
      if(ttcCell) ttcCell.textContent=fmt(base*(1+rate/100));
    });
  }
  refreshPurchaseTtcCheck();
  const box=document.getElementById('pfVatTotals');
  if(!box) return;
  const byRate={};
  draftPurchaseVatLines.forEach(l=>{ const r=Number(l.rate)||0; byRate[r]=(byRate[r]||0)+(Number(l.base)||0); });
  const tot=purchaseDraftTotals();
  box.innerHTML=`<div><span>Total HT</span><span>${fmt(tot.ht)} MAD</span></div>
    ${Object.entries(byRate).sort((a,b)=>b[0]-a[0]).map(([r,base])=>`<div><span>TVA ${r==0?'exonérée (0 %)':r+' %'} (base ${fmt(base)})</span><span>${fmt(base*r/100)} MAD</span></div>`).join('')}
    <div><span>Total TVA</span><span>${fmt(tot.tva)} MAD</span></div>
    <div class="ttc"><span>Total TTC</span><span>${fmt(tot.ttc)} MAD</span></div>`;
  if(typeof renderPurchasePaymentVatCell==='function') renderPurchasePaymentVatCell();
}
/* Contrôle de cohérence : Total HT + Total TVA doit être égal au TTC indiqué sur la facture reçue.
   En cas d'écart, on ALERTE l'utilisateur — aucun montant n'est modifié silencieusement. */
function purchaseTtcDiff(){
  const el=document.getElementById('pf_ttc_check');
  if(!el || el.value==='') return null;
  const declared=parseFloat(el.value);
  if(!Number.isFinite(declared)) return null;
  const calc=purchaseDraftTotals().ttc;
  return {declared, calc, diff:declared-calc};
}
function refreshPurchaseTtcCheck(){
  const zone=document.getElementById('pf_ttc_diff');
  if(!zone) return;
  const d=purchaseTtcDiff();
  const tot=purchaseDraftTotals();
  if(!d){ zone.style.background='#F8F7F1'; zone.style.borderColor='var(--line)'; zone.innerHTML=`<span style="color:var(--ink-soft)">TTC calculé : <strong>${fmt(tot.ttc)} MAD</strong> — saisissez le TTC de la facture pour le contrôle.</span>`; return; }
  if(Math.abs(d.diff)<0.01){
    zone.style.background='#ECF5EE'; zone.style.borderColor='#B9D8C2';
    zone.innerHTML=`<span style="color:var(--ok);font-weight:600;">✓ Cohérent — HT ${fmt(tot.ht)} + TVA ${fmt(tot.tva)} = ${fmt(tot.ttc)} MAD</span>`;
  } else {
    zone.style.background='#FBF0ED'; zone.style.borderColor='#E4C9C2';
    zone.innerHTML=`<span style="color:var(--danger);font-weight:600;">⚠ Écart de ${fmt(Math.abs(d.diff))} MAD</span><span style="color:var(--ink-soft);margin-left:6px;">— calculé ${fmt(d.calc)} / saisi ${fmt(d.declared)}</span>`;
  }
}

/* Rendu des lignes de paiement supplémentaires (facture fournisseur). N'affecte aucune donnée existante :
   la ligne de paiement d'origine (pf_paidamount / pf_paydate / pf_payref / pf_pmode) continue de fonctionner exactement comme avant. */
function renderPurchasePaymentsExtraRows(){
  const body=document.getElementById('pf_payments_extra_body');
  if(!body) return;

        <option value="especes" ${x.mode==='especes'?'selected':''}>Espèces</option>
        <option value="effet" ${x.mode==='effet'?'selected':''}>Effet de commerce</option>
        <option value="compensation" ${x.mode==='compensation'?'selected':''}>Compensation</option>
        <option value="autre" ${x.mode==='autre'?'selected':''}>Autre</option>
      </select></td>
      <td><input class="pp-ref" value="${esc(x.ref||'')}" placeholder="ex. Chèque n°123, virement…"></td>
      <td class="line-actions"><button type="button" class="btn btn-danger btn-sm pp-del" title="Supprimer">✕</button></td>
    </tr>`).join('');
  body.querySelectorAll('tr').forEach(row=>{
    const idx=+row.dataset.idx;
    const ppRefresh=()=>{
      const x2=draftPurchaseExtraPayments[idx];
      const sp=paymentSplitOf(x2.amount, effVatRate(purchaseDraftRates(), x2.vatRate));
      const htC=row.querySelector('.pp-ht'), tvC=row.querySelector('.pp-tva');
      if(htC) htC.textContent=fmt(sp.ht);
      if(tvC) tvC.textContent=fmt(sp.tva);
    };
    const ppVat=row.querySelector('.pp-vat');
    if(ppVat){ draftPurchaseExtraPayments[idx].vatRate=ppVat.value; ppVat.onchange=e=>{draftPurchaseExtraPayments[idx].vatRate=e.target.value; ppRefresh();}; }
    row.querySelector('.pp-amount').oninput=e=>{draftPurchaseExtraPayments[idx].amount=parseFloat(e.target.value)||0; ppRefresh();};
    row.querySelector('.pp-date').oninput=e=>{draftPurchaseExtraPayments[idx].date=e.target.value;};
    row.querySelector('.pp-mode').onchange=e=>{draftPurchaseExtraPayments[idx].mode=e.target.value;};
    row.querySelector('.pp-ref').oninput=e=>{draftPurchaseExtraPayments[idx].ref=e.target.value;};
    row.querySelector('.pp-del').onclick=()=>{ draftPurchaseExtraPayments.splice(idx,1); renderPurchasePaymentsExtraRows(); };
  });
}

      const type=document.getElementById('pf_type').value;
      const paymentDate=document.getElementById('pf_paydate').value;
      const paymentRef=document.getElementById('pf_payref').value.trim();
      const paidAmount=parseFloat(document.getElementById('pf_paidamount').value)||0;
      const vatLines=draftPurchaseVatLines
        .map(l=>({base:Number(l.base)||0, rate:Number(l.rate)||0}))
        .filter(l=>l.base!==0);
      if(!vatLines.length){ toast('Indiquez au moins une base HT dans la ventilation TVA'); return; }
      const draftTotals=purchaseDraftTotals();
      // Contrôle de cohérence : alerte si le TTC saisi diffère du TTC calculé (aucune correction automatique)
      const ttcCheck=purchaseTtcDiff();
      if(ttcCheck && Math.abs(ttcCheck.diff)>=0.01){
        if(!confirm(`Incohérence détectée sur cette facture fournisseur :\n\n`
          +`• Total HT calculé : ${fmt(draftTotals.ht)} MAD\n`
          +`• Total TVA calculé : ${fmt(draftTotals.tva)} MAD\n`
          +`• Total TTC calculé : ${fmt(ttcCheck.calc)} MAD\n`
          +`• Total TTC saisi : ${fmt(ttcCheck.declared)} MAD\n`
          +`• Écart : ${fmt(Math.abs(ttcCheck.diff))} MAD\n\n`
          +`Vérifiez les bases HT et les taux de TVA.\n`
          +`Aucun montant ne sera corrigé automatiquement.\n\n`
          +`Enregistrer quand même ?`)) return;
      }
      // Lignes de paiement supplémentaires : conservées pour l'historique, et leurs montants
      // s'additionnent à la ligne existante (comportement inchangé si aucune ligne n'est ajoutée).
      const extraPaymentsClean = draftPurchaseExtraPayments
        .map(x=>({amount:parseFloat(x.amount)||0, date:x.date||'', mode:x.mode||'', ref:(x.ref||'').trim(), vatRate:(x.vatRate!==undefined&&x.vatRate!==null&&x.vatRate!=='')?(Number(x.vatRate)||0):undefined}))
        .filter(x=>x.amount>0 || x.date || x.mode || x.ref);
      const extraPaymentsSum = extraPaymentsClean.reduce((s,x)=>s+x.amount,0);
      const totalPaidAmount = paidAmount + extraPaymentsSum;
      if(status==='partielle' && (!totalPaidAmount || totalPaidAmount>=draftTotals.ttc)){ toast('Indiquez un montant partiel inférieur au total TTC'); return; }
      if(['payee','partielle'].includes(status) && !paymentDate){ toast('Indiquez la date de débit bancaire'); return; }
      if(status==='en_attente' && !paymentRef){ toast('Indiquez la référence du règlement remis'); return; }
      const data={
        supplierId, number, designation, assetNature:type==='immobilisation'?document.getElementById('pf_asset_nature').value.trim():'', date:document.getElementById('pf_date').value||todayISO(), dueDate:document.getElementById('pf_due').value,
        vatLines,
        ttcDeclared: (document.getElementById('pf_ttc_check')||{}).value!=='' ? (parseFloat(document.getElementById('pf_ttc_check').value)||0) : undefined,
        ht: vatLines.reduce((s,l)=>s+l.base,0),
        vatRate: vatLines.reduce((a,b)=>Math.abs(b.base)>Math.abs(a.base)?b:a).rate,
        type, dureeAns: type==='immobilisation' ? (parseInt(document.getElementById('pf_duree').value)||5) : undefined,
        status, notes:document.getElementById('pf_notes').value.trim(),
        paymentDate: ['payee','partielle'].includes(status) ? paymentDate : '',
        paidAmount: status==='partielle' ? totalPaidAmount : undefined,
        paymentRef: status==='impayee' ? '' : paymentRef,
        paymentMode: document.getElementById('pf_pmode').value,
        paymentVatRate: (document.querySelector('.ppm-vat')&&document.querySelector('.ppm-vat').value!=='') ? (Number(document.querySelector('.ppm-vat').value)||0) : undefined,
        extraPayments: extraPaymentsClean,
        nature: document.getElementById('pf_nature').value,
        linkedPurchaseId: document.getElementById('pf_nature').value==='avoir' ? document.getElementById('pf_linked_purchase').value : ''
      };
      if(p){ Object.assign(p,data); delete p.amount; } else { data.id=uid(); state.purchases.push(data); }
      save(); closeModal(); renderAll(); toast(p?'Achat mis à jour':'Achat enregistré');
    }}
  ]);
  setTimeout(()=>{ renderPurchasePaymentsExtraRows(); renderPurchasePaymentVatCell(); },0);
  const pfBtnAddPayment=document.getElementById('pfBtnAddPayment');
  if(pfBtnAddPayment) pfBtnAddPayment.onclick=()=>{ draftPurchaseExtraPayments.push({amount:'',date:'',mode:'',ref:''}); renderPurchasePaymentsExtraRows(); };
  const statusEl=document.getElementById('pf_status');
  const paymentSection=document.getElementById('pf_payment_section');
  statusEl.onchange=()=>{ paymentSection.style.display = statusEl.value==='impayee' ? 'none':'block'; };
  const typeEl=document.getElementById('pf_type');
  const dureeWrap=document.getElementById('pf_duree_wrap');
  typeEl.onchange=()=>{ dureeWrap.style.display = typeEl.value==='immobilisation' ? 'grid':'none'; };
  const natureEl=document.getElementById('pf_nature');
  const linkedWrap=document.getElementById('pf_linked_wrap');
  if(natureEl && linkedWrap) natureEl.onchange=()=>{ linkedWrap.style.display = natureEl.value==='avoir' ? 'block':'none'; };
  renderPurchaseVatLines();
  const addVatLine=document.getElementById('pfAddVatLine');
  if(addVatLine) addVatLine.onclick=()=>{ draftPurchaseVatLines.push({base:0, rate:20}); renderPurchaseVatLines(); };
  const ttcCheckEl=document.getElementById('pf_ttc_check');
  if(ttcCheckEl) ttcCheckEl.oninput=refreshPurchaseTtcCheck;
  refreshPurchaseTtcCheck();
}

  if(docFilter.from) docs=docs.filter(d=>d.date>=docFilter.from); if(docFilter.to) docs=docs.filter(d=>d.date<=docFilter.to); if(docFilter.min) docs=docs.filter(d=>computeDoc(d).ttc>=+docFilter.min);
  const docSortValue = (d,col) => { const c=clientById(d.clientId); const t=computeDoc(d); if(col==='number') return (d.number||'').toLowerCase(); if(col==='client') return (c?.name||'').toLowerCase(); if(col==='date') return d.date||''; if(col==='dueDate') return d.dueDate||''; if(col==='status') return (STATUS_LABEL[effectiveStatus(d)]||effectiveStatus(d)||'').toLowerCase(); if(col==='ttc') return Math.abs(Number(t.ttc)||0); return ''; };
  docs.sort((a,b)=>{ const av=docSortValue(a,docSort.col), bv=docSortValue(b,docSort.col); const r=av<bv?-1:av>bv?1:0; return docSort.dir==='asc'?r:-r; });

  const statusOptions = type==='bl' ? ['brouillon','validee','envoyee'] : ['brouillon','validee','envoyee','partielle','en_attente','payee','retard'];

    <select id="fclient"><option value="all">Tous clients</option>${clientOptions.map(c=>`<option value="${c.id}" ${docFilter.client===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
    <input type="date" id="ffrom" value="${docFilter.from}" title="Date de début"><input type="date" id="fto" value="${docFilter.to}" title="Date de fin"><input type="number" min="0" step="any" id="fmin" value="${docFilter.min}" placeholder="TTC minimum">
  </div>
  <div class="card" style="padding:0;overflow:hidden;">
    ${docs.length? `<table><thead><tr>
      ${[['number','Numéro'],['client','Client'],['date','Date'],...(type!=='bl'?[['dueDate','Échéance']]:[]),['status','Statut'],['ttc',type==='bl'?'Articles':'TTC']].map(([key,label])=>`<th data-sort-doc="${key}" class="${key==='ttc'?'num':''}" style="cursor:pointer;user-select:none;${key==='ttc'?'text-align:right':''}">${label}${docSort.col===key?(docSort.dir==='asc'?' ▲':' ▼'):''}</th>`).join('')}<th></th></tr></thead><tbody>
    ${docs.map(d=>{const c=clientById(d.clientId); const t=computeDoc(d);

}
