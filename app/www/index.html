let draftItems=[];
let draftAvoirAllocations=[];
let activeDocForm=null;
let draftExtraPayments=[]; // AJOUT — paiements supplémentaires (au-delà de la ligne existante) pour une facture

function newItem(){ return {id:uid(), desc:'', unit:'u', qty:1, price:0, discount:0, vat:20}; }
function draftAvoirTotal(){ return Math.abs(computeDoc({items:draftItems,nature:'avoir'}).ttc); }
function existingAvoirAllocationForInvoice(doc, invoiceId){ return doc&&Array.isArray(doc.allocations) ? (doc.allocations.find(x=>x.invoiceId===invoiceId)?.amount||0) : 0; }
function invoiceAvailableForAvoirDraft(invoice, doc){ return Math.max(0, invoiceRemain(invoice)+existingAvoirAllocationForInvoice(doc, invoice.id)); }
function avoirCandidateInvoices(clientId, doc){
  return state.docs.filter(d=>d.type==='facture' && (d.nature||'doit')==='doit' && d.clientId===clientId && d.number && invoiceAvailableForAvoirDraft(d,doc)>0)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function syncAvoirAllocationAmounts(doc){
  const nature=document.getElementById('df_nature')?.value||'doit';
  const clientId=document.getElementById('df_client')?.value||'';
  if(nature!=='avoir'||!clientId) return;
  const total=draftAvoirTotal();
  const candidates=avoirCandidateInvoices(clientId,doc);
  const byId=new Map(candidates.map(x=>[x.id,x]));
  draftAvoirAllocations=draftAvoirAllocations.filter(x=>byId.has(x.invoiceId));
  // First clamp each manual allocation to the current invoice capacity.
  draftAvoirAllocations.forEach(x=>{ x.amount=Math.max(0,Math.min(invoiceAvailableForAvoirDraft(byId.get(x.invoiceId),doc),+x.amount||0)); });
  let sum=draftAvoirAllocations.reduce((s,x)=>s+x.amount,0);
  // If the avoir amount was reduced, reduce the last allocations first.
  if(sum>total+0.0001){
    let excess=sum-total;
    for(let i=draftAvoirAllocations.length-1;i>=0&&excess>0;i--){
      const cut=Math.min(draftAvoirAllocations[i].amount,excess);
      draftAvoirAllocations[i].amount-=cut; excess-=cut;
    }
  } else if(sum<total-0.0001){
    // If the avoir amount increased, automatically use remaining capacity on already selected invoices.
    let need=total-sum;
    for(const x of draftAvoirAllocations){
      const cap=invoiceAvailableForAvoirDraft(byId.get(x.invoiceId),doc);
      const add=Math.min(Math.max(0,cap-x.amount),need);
      x.amount+=add; need-=add;
      if(need<=0) break;
    }
  }
  const allocated=draftAvoirAllocations.reduce((s,x)=>s+x.amount,0);
  const selectedIds=new Set(draftAvoirAllocations.map(x=>x.invoiceId));
  const selectedCapacity=candidates.filter(x=>selectedIds.has(x.id)).reduce((s,x)=>s+invoiceAvailableForAvoirDraft(x,doc),0);
  document.querySelectorAll('.df-avoir-amount').forEach(inp=>{
    const al=draftAvoirAllocations.find(x=>x.invoiceId===inp.dataset.invoice);
    const inv=byId.get(inp.dataset.invoice);
    if(al){ inp.disabled=false; inp.value=String(Math.round(al.amount*100)/100); inp.max=String(Math.min(invoiceAvailableForAvoirDraft(inv,doc),total)); }
    else inp.disabled=true;
  });
  const summary=document.querySelector('#df_avoir_alloc_wrap .df-avoir-summary');
  if(summary) summary.innerHTML=`<div>Avoir : <strong>${fmt(total)} MAD</strong></div><div>Imputé : <strong>${fmt(allocated)} MAD</strong> · Reste : <strong>${fmt(Math.max(0,total-allocated))} MAD</strong></div>`;
  const msg=document.querySelector('#df_avoir_alloc_wrap .df-avoir-status');
  if(msg) msg.innerHTML=total<=0?'Saisissez d’abord les lignes de l’avoir pour connaître le montant à imputer.':selectedCapacity+0.0001>=total?'<span style="color:var(--teal-deep)">✓ Les factures sélectionnées couvrent le montant de l’avoir.</span>':`<span style="color:var(--danger)">Sélection insuffisante : il manque ${fmt(total-selectedCapacity)} MAD de capacité sur les factures sélectionnées.</span>`;
}
function renderAvoirAllocations(doc){
  const wrap=document.getElementById('df_avoir_alloc_wrap');
  if(!wrap) return;
  const nature=document.getElementById('df_nature')?.value||'doit';
  const clientId=document.getElementById('df_client')?.value||'';
  if(nature!=='avoir' || !clientId){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  const total=draftAvoirTotal();
  const candidates=avoirCandidateInvoices(clientId,doc);
  const selectedIds=new Set(draftAvoirAllocations.map(x=>x.invoiceId));
  const selectedAvailable=candidates.filter(x=>selectedIds.has(x.id)).reduce((s,x)=>s+invoiceAvailableForAvoirDraft(x,doc),0);
  const allocated=draftAvoirAllocations.reduce((s,x)=>s+(+x.amount||0),0);
  const remaining=Math.max(0,total-allocated);
  const enoughSelected=selectedAvailable+0.0001>=total;
  const statusHtml=total<=0
    ? '<span style="color:var(--ink-soft)">Saisissez d’abord les lignes de l’avoir pour connaître le montant à imputer.</span>'
    : enoughSelected
      ? '<span style="color:var(--teal-deep)">✓ Les factures sélectionnées couvrent le montant de l’avoir.</span>'
      : `<span style="color:var(--danger)">Sélection insuffisante : il manque ${fmt(total-selectedAvailable)} MAD de capacité sur les factures sélectionnées.</span>`;
  wrap.innerHTML=`<div class="card" style="background:#FBF8F0;border-color:var(--gold);">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
      <div><h3 style="font-size:15px;margin:0 0 4px;">Imputation de l’avoir</h3><div style="font-size:12px;color:var(--ink-soft);">Seules les factures du client sélectionné sont proposées. Vous pouvez en sélectionner plusieurs.</div></div>
      <div class="df-avoir-summary" style="font-size:12.5px;text-align:right;"><div>Avoir : <strong>${fmt(total)} MAD</strong></div><div>Imputé : <strong>${fmt(allocated)} MAD</strong> · Reste : <strong>${fmt(remaining)} MAD</strong></div></div>
    </div>
    <div class="df-avoir-status" style="margin:10px 0;font-size:12.5px;">${statusHtml}</div>
    ${candidates.length?`<div style="overflow:auto;"><table><thead><tr><th></th><th>Facture</th><th>Date</th><th class="num">Total TTC</th><th class="num">Reste disponible</th><th class="num">Montant imputé</th></tr></thead><tbody>${candidates.map(inv=>{
      const available=invoiceAvailableForAvoirDraft(inv,doc);
      const al=draftAvoirAllocations.find(x=>x.invoiceId===inv.id);
      const checked=!!al;
      const max=Math.min(available, Math.max(0,total));
      return `<tr><td><input type="checkbox" class="df-avoir-check" data-invoice="${inv.id}" ${checked?'checked':''}></td><td>${esc(inv.number)}</td><td>${inv.date}</td><td class="num">${fmt(computeDoc(inv).ttc)}</td><td class="num">${fmt(available)}</td><td class="num"><input type="number" class="df-avoir-amount" data-invoice="${inv.id}" min="0" max="${max}" step="any" value="${checked?al.amount:'0'}" ${checked?'':'disabled'} style="width:110px;"></td></tr>`;
    }).join('')}</tbody></table></div>`:'<div class="empty">Aucune facture disponible pour ce client.</div>'}
    <div style="margin-top:8px;font-size:11.5px;color:var(--ink-soft);">Règle : le total des montants imputés ne peut jamais dépasser le montant de l’avoir. Pour imputer l’avoir en totalité, la capacité restante des factures sélectionnées doit être <strong>égale ou supérieure</strong> au montant de l’avoir.</div>
  </div>`;
  wrap.querySelectorAll('.df-avoir-check').forEach(ch=>ch.onchange=()=>{
    const invoiceId=ch.dataset.invoice;
    const inv=candidates.find(x=>x.id===invoiceId);
    if(ch.checked){
      const available=invoiceAvailableForAvoirDraft(inv,doc);
      const otherAllocated=draftAvoirAllocations.filter(x=>x.invoiceId!==invoiceId).reduce((s,x)=>s+(+x.amount||0),0);
      const amount=Math.min(available,Math.max(0,total-otherAllocated));
      const existing=draftAvoirAllocations.find(x=>x.invoiceId===invoiceId);
      if(existing) existing.amount=amount; else draftAvoirAllocations.push({invoiceId,amount});
    }else{
      draftAvoirAllocations=draftAvoirAllocations.filter(x=>x.invoiceId!==invoiceId);
    }
    renderAvoirAllocations(doc);
  });
  wrap.querySelectorAll('.df-avoir-amount').forEach(inp=>inp.oninput=()=>{
    const invoiceId=inp.dataset.invoice;
    const inv=candidates.find(x=>x.id===invoiceId);
    const available=invoiceAvailableForAvoirDraft(inv,doc);
    let amount=Math.max(0,Math.min(available,parseFloat(inp.value)||0));
    const otherAllocated=draftAvoirAllocations.filter(x=>x.invoiceId!==invoiceId).reduce((s,x)=>s+(+x.amount||0),0);
    if(otherAllocated+amount>total+0.0001){ amount=Math.max(0,total-otherAllocated); inp.value=amount; toast('Le total imputé ne peut pas dépasser le montant de l’avoir'); }
    const existing=draftAvoirAllocations.find(x=>x.invoiceId===invoiceId);
    if(existing) existing.amount=amount; else draftAvoirAllocations.push({invoiceId,amount});
    const summary=wrap.querySelector('.df-avoir-summary');
    const sum=draftAvoirAllocations.reduce((s,x)=>s+(+x.amount||0),0);
    if(summary) summary.innerHTML=`<div>Avoir : <strong>${fmt(total)} MAD</strong></div><div>Imputé : <strong>${fmt(sum)} MAD</strong> · Reste : <strong>${fmt(Math.max(0,total-sum))} MAD</strong></div>`;
    const selectedIds=new Set(draftAvoirAllocations.map(x=>x.invoiceId));
    const selectedCapacity=candidates.filter(x=>selectedIds.has(x.id)).reduce((s,x)=>s+invoiceAvailableForAvoirDraft(x,doc),0);
    const status=wrap.querySelector('.df-avoir-status');
    if(status) status.innerHTML=selectedCapacity+0.0001>=total?'<span style="color:var(--teal-deep)">✓ Les factures sélectionnées couvrent le montant de l’avoir.</span>':`<span style="color:var(--danger)">Sélection insuffisante : il manque ${fmt(Math.max(0,total-selectedCapacity))} MAD de capacité sur les factures sélectionnées.</span>`;
  });
}

    };
    row.querySelector('.it-qty').oninput=e=>{draftItems[idx].qty=parseFloat(e.target.value)||0; updateLineTotal();};
    row.querySelector('.it-price').oninput=e=>{draftItems[idx].price=parseFloat(e.target.value)||0; updateLineTotal();};
    row.querySelector('.it-disc').oninput=e=>{draftItems[idx].discount=parseFloat(e.target.value)||0; updateLineTotal();};
    const vatEl=row.querySelector('.it-vat'); if(vatEl) vatEl.onchange=e=>{draftItems[idx].vat=+e.target.value; updateLineTotal();};
    row.querySelector('.it-del').onclick=()=>{ draftItems.splice(idx,1); if(draftItems.length===0) draftItems.push(newItem()); refreshItems(isBL); };
  });
  refreshTotals(isBL);
}

/* AJOUT — rendu des lignes de paiement supplémentaires (facture). N'affecte aucune donnée existante :
   la ligne de paiement d'origine (df_paidamount / df_paydate / df_payref / df_pmode) continue de fonctionner exactement comme avant. */
function renderPaymentsExtraRows(){
  const body=document.getElementById('df_payments_extra_body');
  if(!body) return;
  body.innerHTML = draftExtraPayments.map((p,idx)=>`
    <tr data-idx="${idx}">
      <td><input class="dp-amount" type="number" min="0" step="any" value="${p.amount||''}" placeholder="0"></td>
      ${paymentVatCellsHtml(docDraftRates(), p.amount, p.vatRate, 'dp')}
      <td><input class="dp-date" type="date" value="${p.date||''}"></td>
      <td><select class="dp-mode">
        <option value="" ${!p.mode?'selected':''}>—</option>
        <option value="Virement" ${p.mode==='Virement'?'selected':''}>Virement</option>
        <option value="Chèque" ${p.mode==='Chèque'?'selected':''}>Chèque</option>
        <option value="Espèces" ${p.mode==='Espèces'?'selected':''}>Espèces</option>
        <option value="Effet de commerce" ${p.mode==='Effet de commerce'?'selected':''}>Effet de commerce</option>
        <option value="Compensation" ${p.mode==='Compensation'?'selected':''}>Compensation</option>
        <option value="Autre" ${p.mode==='Autre'?'selected':''}>Autre</option>
      </select></td>
      <td><input class="dp-ref" value="${esc(p.ref||'')}" placeholder="ex. Chèque n°123, virement…"></td>
      <td class="line-actions"><button type="button" class="btn btn-danger btn-sm dp-del" title="Supprimer">✕</button></td>
    </tr>`).join('');
  body.querySelectorAll('tr').forEach(row=>{
    const idx=+row.dataset.idx;
    const dpRefresh=()=>{
      const x=draftExtraPayments[idx];
      const sp=paymentSplitOf(x.amount, effVatRate(docDraftRates(), x.vatRate));
      const htC=row.querySelector('.dp-ht'), tvC=row.querySelector('.dp-tva');
      if(htC) htC.textContent=fmt(sp.ht);
      if(tvC) tvC.textContent=fmt(sp.tva);
    };
    const dpVat=row.querySelector('.dp-vat');
    if(dpVat){ draftExtraPayments[idx].vatRate=dpVat.value; dpVat.onchange=e=>{draftExtraPayments[idx].vatRate=e.target.value; dpRefresh();}; }
    row.querySelector('.dp-amount').oninput=e=>{draftExtraPayments[idx].amount=parseFloat(e.target.value)||0; dpRefresh();};
    row.querySelector('.dp-date').oninput=e=>{draftExtraPayments[idx].date=e.target.value;};
    row.querySelector('.dp-mode').onchange=e=>{
      draftExtraPayments[idx].mode=e.target.value;
      if(e.target.value==='Espèces'){
        const invDateEl=document.getElementById('df_date');
        const dateInput=row.querySelector('.dp-date');
        if(invDateEl&&dateInput){ dateInput.value=invDateEl.value; draftExtraPayments[idx].date=invDateEl.value; }
      }
    };
    row.querySelector('.dp-ref').oninput=e=>{draftExtraPayments[idx].ref=e.target.value;};
    row.querySelector('.dp-del').onclick=()=>{ draftExtraPayments.splice(idx,1); renderPaymentsExtraRows(); };
  });
}

function openDocModal(type, docId){
  const doc = docId ? state.docs.find(d=>d.id===docId) : null;
  if(doc&&(doc.locked||vatLocked(itemVatKey(doc)))){ toast(doc.locked?'Document verrouillé : déverrouillez-le depuis sa fiche pour le modifier':'Cette donnée est verrouillée par la TVA'); return; }
  if(!state.clients.length && !doc){ toast('Ajoutez d\'abord un client'); return; }
  const isBL = type==='bl';
  activeDocForm=doc;
  openModal((doc?'Modifier — ':'Nouveau — ')+TYPE_LABEL[type], docFormHtml(type,doc), [
    {label:'Annuler', cls:'btn-ghost', action:closeModal},
    {label: doc? 'Enregistrer' : 'Créer', cls:'btn-primary', action:()=>saveDocForm(type, doc)}
  ]);
  setTimeout(()=>{ renderItemsRows(isBL); if(type==='facture'){ renderPaymentsExtraRows(); renderDocPaymentVatCell(); } },0);
  document.getElementById('btnAddItem').onclick=()=>{ draftItems.push(newItem()); renderItemsRows(isBL); };
  const btnAddPayment=document.getElementById('btnAddPayment');
  if(btnAddPayment) btnAddPayment.onclick=()=>{ draftExtraPayments.push({amount:'',date:'',mode:'',ref:''}); renderPaymentsExtraRows(); };
  const avEl=document.getElementById('df_avance');
  if(avEl) avEl.oninput=()=>refreshTotals(isBL);
  const dueEl=document.getElementById('df_due'), dateEl=document.getElementById('df_date'), dueDaysEl=document.getElementById('df_due_days');
  const refreshDueDays=()=>{ if(dueDaysEl) dueDaysEl.textContent = dueEl.value ? dueDaysLabel(dateEl.value, dueEl.value) : ''; };
  const delayEl=document.getElementById('df_delay');
  const syncDueFromDelay=()=>{
    if(!delayEl||!dateEl||!dueEl) return;
    const days=parseInt(delayEl.value,10);
    if(Number.isFinite(days)&&days>=0&&dateEl.value){
      const z=new Date(dateEl.value+'T00:00:00');
      z.setDate(z.getDate()+days);
      dueEl.value=z.toISOString().slice(0,10);
    }
    refreshDueDays();
  };
  if(dueEl){ dueEl.oninput=refreshDueDays; dateEl.oninput=()=>{refreshDueDays(); if(delayEl&&delayEl.value!=='') syncDueFromDelay();}; }
  if(delayEl) delayEl.oninput=syncDueFromDelay;
  const statusEl=document.getElementById('df_status');
  const paymentSection=document.getElementById('df_payment_section');
  const paymentNote=document.getElementById('df_payment_note');
  if(statusEl && paymentSection){
    const syncPaymentFields=()=>{
      const needsPayment=['partielle','en_attente','payee'].includes(statusEl.value);
      paymentSection.style.display = needsPayment ? 'block':'none';
      if(paymentNote) paymentNote.style.display = statusEl.value==='en_attente' ? 'block':'none';
    };
    statusEl.onchange=syncPaymentFields;
    syncPaymentFields();
  }
  // AJOUT — règle Espèces : la date de paiement reprend automatiquement la date de la facture (ligne existante + lignes ajoutées)
  const pmodeEl=document.getElementById('df_pmode');
  const paydateEl=document.getElementById('df_paydate');
  const invDateEl=document.getElementById('df_date');
  const syncCashDateMainLine=()=>{
    if(pmodeEl&&paydateEl&&invDateEl&&pmodeEl.value==='Espèces'){ paydateEl.value=invDateEl.value; }
  };
  if(pmodeEl) pmodeEl.onchange=syncCashDateMainLine;
  if(invDateEl){
    const prevDateOninput=invDateEl.oninput;
    invDateEl.oninput=(e)=>{ if(prevDateOninput) prevDateOninput(e); syncCashDateMainLine(); };
  }
  const contractEl=document.getElementById('df_contract');
  const showContractEl=document.getElementById('df_show_contract');
  if(contractEl&&showContractEl) contractEl.onchange=()=>{ const c=contractById(contractEl.value); showContractEl.checked=!!c?.showOnOutput; };
  const natureEl=document.getElementById('df_nature');
  const linkedWrap=document.getElementById('df_linked_wrap');
  const clientEl=document.getElementById('df_client');
  const syncAvoirSection=()=>{
    if(linkedWrap) linkedWrap.style.display='none';
    if(natureEl&&natureEl.value==='avoir') renderAvoirAllocations(doc);
    else if(document.getElementById('df_avoir_alloc_wrap')) document.getElementById('df_avoir_alloc_wrap').style.display='none';
  };
  if(natureEl) natureEl.onchange=()=>{
    if(natureEl.value!=='avoir') draftAvoirAllocations=[];
    refreshTotals(isBL);
    syncAvoirSection();
  };
  if(clientEl) clientEl.onchange=()=>{
    if(natureEl&&natureEl.value==='avoir'){ draftAvoirAllocations=[]; renderAvoirAllocations(doc); }
  };
  syncAvoirSection();
}

function saveDocForm(type, doc){
  const clientId = document.getElementById('df_client').value;
  if(!clientId){ toast('Sélectionnez un client'); return; }
  const date = document.getElementById('df_date').value || todayISO();
  const dueEl = document.getElementById('df_due');
  const delayEl = document.getElementById('df_delay');
  const paymentDelayDays = delayEl ? Math.max(0,parseInt(delayEl.value,10)||0) : 0;
  let dueDate = dueEl ? dueEl.value : '';
  if(type==='facture' && delayEl && delayEl.value!=='' && date){
    const z=new Date(date+'T00:00:00');
    z.setDate(z.getDate()+paymentDelayDays);
    dueDate=z.toISOString().slice(0,10);
  }
  const items = draftItems.filter(it=>it.desc.trim()!=='' && it.qty>0);
  if(!items.length){ toast('Ajoutez au moins une ligne valide'); return; }

  const data = {
    clientId, date,
    dueDate: dueDate,
    paymentDelayDays: type==='facture' ? paymentDelayDays : 0,
    object: document.getElementById('df_object').value.trim(),
    items,
    notes: document.getElementById('df_notes').value.trim(),
    locked: document.getElementById('df_lock').checked,
  };
  const natureEl=document.getElementById('df_nature');
  data.nature = natureEl ? natureEl.value : 'doit';
  const linkedEl=document.getElementById('df_linked_invoice');
  data.linkedInvoiceId = (linkedEl && data.nature==='avoir') ? linkedEl.value : '';
  if(type==='facture' && data.nature==='avoir'){
    const avoirAmount=Math.abs(computeDoc({...data,items,nature:'avoir'}).ttc);
    const cleanAllocations=draftAvoirAllocations.filter(x=>+x.amount>0).map(x=>({invoiceId:x.invoiceId,amount:+x.amount}));
    let allocatedTotal=0, selectedCapacity=0;
    const seen=new Set();
    for(const al of cleanAllocations){
      if(seen.has(al.invoiceId)){ toast('Une facture ne peut être sélectionnée qu’une seule fois'); return; }
      seen.add(al.invoiceId);
      const inv=state.docs.find(x=>x.id===al.invoiceId);
      if(!inv || inv.type!=='facture' || (inv.nature||'doit')==='avoir' || inv.clientId!==clientId){ toast('Une facture sélectionnée n’appartient pas au client choisi'); return; }
      const available=invoiceAvailableForAvoirDraft(inv,doc);
      if(al.amount>available+0.0001){ toast(`Le montant imputé sur ${inv.number||'la facture'} dépasse son reste disponible`); return; }
      allocatedTotal+=al.amount; selectedCapacity+=available;
    }
    if(cleanAllocations.length && selectedCapacity+0.0001<avoirAmount){ toast(`Les factures sélectionnées ne couvrent pas le montant de l’avoir. Sélectionnez des factures supplémentaires (il manque ${fmt(avoirAmount-selectedCapacity)} MAD de capacité).`); return; }
    if(allocatedTotal>avoirAmount+0.0001){ toast('Le total des imputations ne peut pas dépasser le montant de l’avoir'); return; }
    if(avoirAmount>0 && allocatedTotal+0.0001<avoirAmount){ toast(`Il reste ${fmt(avoirAmount-allocatedTotal)} MAD de l’avoir à imputer. Répartissez le montant total sur les factures sélectionnées.`); return; }
    data.allocations=cleanAllocations;
    data.linkedInvoiceId=cleanAllocations[0]?.invoiceId||'';
  } else {
    data.allocations=[];
  }
  if(type!=='bl'){
    data.paymentMode = document.getElementById('df_pmode').value;
    data.status = document.getElementById('df_status').value;
    data.avance = parseFloat(document.getElementById('df_avance').value)||0;
  } else {
    data.status = doc? doc.status : 'brouillon';
  }
  if(type==='facture'){
    const contractId=document.getElementById('df_contract').value;
    const contract=contractById(contractId);
    if(contract && contract.clientId!==clientId){toast('Le contrat / marché doit appartenir au client de la facture');return;}
    data.contractId=contractId;
    data.showContractOnOutput=!!contract && document.getElementById('df_show_contract').checked;
    if(contract){const already=linkedContractDocs(contractId).filter(d=>!doc||d.id!==doc.id).reduce((s,d)=>s+computeDoc(d).ttc,0);const candidate=computeDoc({...data,items}).ttc;if(already+candidate>+contract.amount&& !confirm('Le total facturé dépasse le montant du contrat / marché. Continuer ?'))return;}
    const pdEl=document.getElementById('df_paydate');
    const prEl=document.getElementById('df_payref');
    const paymentDate=pdEl ? pdEl.value : '';
    const paymentRef=prEl ? prEl.value.trim() : '';
    const paidAmountEl=document.getElementById('df_paidamount');
    // AJOUT — lignes de paiement supplémentaires : conservées telles quelles pour l'historique,
    // et leurs montants s'additionnent à la ligne existante (comportement inchangé si aucune ligne n'est ajoutée).
    const extraPaymentsClean = draftExtraPayments
      .map(p=>({amount:parseFloat(p.amount)||0, date:p.date||'', mode:p.mode||'', ref:(p.ref||'').trim(), vatRate:(p.vatRate!==undefined&&p.vatRate!==null&&p.vatRate!=='')?(Number(p.vatRate)||0):undefined}))
      .filter(p=>p.amount>0 || p.date || p.mode || p.ref);
    data.extraPayments = extraPaymentsClean;
    const dfPayVatEl=document.querySelector('.dpm-vat');
    if(dfPayVatEl && dfPayVatEl.value!=='') data.paymentVatRate = Number(dfPayVatEl.value)||0;
    const extraPaymentsSum = extraPaymentsClean.reduce((s,p)=>s+p.amount,0);
    const baseManualAmount = paidAmountEl ? (parseFloat(paidAmountEl.value)||0) : 0;
    data.paidAmount = data.status==='partielle' ? (baseManualAmount + extraPaymentsSum) : undefined;
    if(data.status==='partielle' && (!data.paidAmount || data.paidAmount>=computeDoc({...data,items}).ttc)){ toast('Indiquez un montant partiel inférieur au total TTC'); return; }
    if(['payee','partielle'].includes(data.status) && !paymentDate){ toast('Indiquez la date d’encaissement bancaire'); return; }
    if(data.status==='en_attente' && !paymentRef){ toast('Indiquez la référence du règlement remis'); return; }
    data.paymentDate = data.status==='payee' ? paymentDate : '';
    data.paymentRef = ['payee','en_attente','partielle'].includes(data.status) ? paymentRef : '';
  }

  const manualNumberEl = document.getElementById('df_manual_number');
  const manualNumber = manualNumberEl ? manualNumberEl.value.trim() : '';
  if(manualNumber){
    const dup = state.docs.some(d=>d.number===manualNumber && (!doc||d.id!==doc.id));
    if(dup){ toast('Ce numéro est déjà utilisé par un autre document'); return; }
  }

  if(doc){
    if(manualNumber){ data.number = manualNumber; }
    else if(!doc.number && data.status!=='brouillon'){ data.number = nextNumber(type, data.nature); }
    Object.assign(doc, data);
  } else {
    data.id = uid(); data.type = type;
    if(manualNumber){ data.number = manualNumber; }
    else if(data.status!=='brouillon'){ data.number = nextNumber(type, data.nature); } else { data.number=''; }
    state.docs.push(data);
  }
  save(); closeModal(); renderAll();
  toast((doc?'Document mis à jour':'Document créé')+(data.number? ' — '+data.number:''));
}

function nextNumber(type, nature){
  const key = nature==='avoir' ? type+'_avoir' : type;
  state.seq[key] = (state.seq[key]||0)+1;
  const year = new Date().getFullYear();
  const prefix = nature==='avoir' ? 'AV-'+TYPE_PREFIX[type] : TYPE_PREFIX[type];
  return `${prefix}-${year}-${String(state.seq[key]).padStart(4,'0')}`;
}
function lastValidatedNumber(type, nature){
  const list = state.docs.filter(d=>d.type===type && d.number && (d.nature||'doit')===(nature||'doit'));
  if(!list.length) return null;
  list.sort((a,b)=>a.number.localeCompare(b.number));
  return list[list.length-1].number;
}

/* La zone de pied de page doit toujours se placer en bas de la feuille : on cale la hauteur
   minimale de la page sur la hauteur utile réelle (A4 = 297 mm moins les marges d'impression). */
function applyPrintPageStyle(marginMm, footerAtBottom){
  let styleTag = document.getElementById('printMarginStyle');
  if(!styleTag){ styleTag=document.createElement('style'); styleTag.id='printMarginStyle'; document.head.appendChild(styleTag); }
  styleTag.textContent = `@media print{
    @page{ size:A4 portrait; margin:${marginMm}mm; }
    /* Taille du texte imprime, reglable dans Parametres (ecran non affecte) */
    #printArea{ --print-scale:${(printTextSizePct()/100).toFixed(3)}; }
    /* hauteur utile reelle de la feuille = 297mm moins les deux marges @page.
       padding:0 obligatoire, sinon la marge est comptee deux fois. */
    #printArea .inv-page{ display:flex; flex-direction:column; padding:0; margin:0;
      ${footerAtBottom?`min-height:calc(297mm - ${marginMm*2}mm);`:'min-height:0;'} }
    #printArea .inv-footer-zone{ margin-top:auto; break-inside:avoid; page-break-inside:avoid; }
    ${itemsColumnRules(marginMm)}
  }`;
}

/* Largeurs des colonnes du tableau d'articles, recalculees selon la largeur utile
   de la feuille ET la taille de texte choisie : quand le texte grandit, les
   colonnes chiffrees doivent grandir aussi, sinon les montants sont coupes.
   Besoins mesures a 100 % sur 180mm (en mm, padding inclus). */
/* Besoins mesures dans le rendu reel (padding compris), a 100 % sur 180mm :
   - donnees : montants a 7 chiffres pour Montant HT / TTC, 6 chiffres pour PU / TVA
   - en-tetes : mot le plus long, en MAJUSCULES avec interlettrage (comme rendu) */
const ITEMS_COL_MM ={qte:8.0, unite:9.0,  pu:21.6, remise:11.5, ht:24.1, taux:10.0, tva:21.6, ttc:24.1};
const ITEMS_HEAD_MM={qte:8.6, unite:11.9, pu:6.6,  remise:14.1, ht:18.7, taux:11.0, tva:18.7, ttc:18.7};
const ITEMS_DESIGNATION_MIN_PCT=15;   // la designation ne descend jamais sous 15 % de la page
function itemsColumnRules(marginMm){
  const usable = 210 - 2*marginMm;                    // largeur utile de la feuille
  const scale  = printTextSizePct()/100;
  // Les EN-TETES ne suivent l'agrandissement que partiellement : ce sont des
  // libelles, pas des donnees. Cela evite de gaspiller la largeur disponible.
  const headScale = Math.min(1.05, 1 + (scale-1)*0.35);
  const headPt = (8.5*headScale).toFixed(2);
  const keys=['qte','unite','pu','remise','ht','taux','tva','ttc'];
  let need = keys.map(k=>Math.max(ITEMS_COL_MM[k]*scale, ITEMS_HEAD_MM[k]*headScale));
  let sum  = need.reduce((a,b)=>a+b,0);
  let designation = usable - sum;
  const minDes = usable*ITEMS_DESIGNATION_MIN_PCT/100;
  if(designation < minDes){                            // pas assez de place : on repartit
    const factor = (usable - minDes)/sum;
    need = need.map(v=>v*factor);
    designation = minDes;
  }
  const pct = v => (v/usable*100).toFixed(2);
  const cols = [designation, ...need];
  return cols.map((v,i)=>`#printArea .inv-page > table.inv-items th:nth-child(${i+1}),#printArea .inv-page > table.inv-items td:nth-child(${i+1}){width:${pct(v)}%;}`).join('\n    ')
    + '\n    #printArea .inv-items th{font-size:'+headPt+'pt;}';
}

function vatRegime(){return state.vatConfig.regime||'mensuel'}
function vatYear(){return +state.vatConfig.year||new Date().getFullYear()}
function vatKey(y,m){return vatRegime()==='trimestriel'?tvaKeyOf(quarterRangeOf(y,Math.ceil(m/3))):tvaKeyOf(monthRangeOf(y,m))}
function vatRange(key){if(!key)return null;const [start,end]=key.split('→');return {start,end}}
function vatLabel(key){const r=vatRange(key);if(!r)return '';const y=+r.start.slice(0,4),m=+r.start.slice(5,7);return vatRegime()==='trimestriel'?`TVA — ${['1er','2e','3e','4e'][Math.floor((m-1)/3)]} trimestre ${y}`:`TVA — Déclaration TVA ${MONTH_NAMES[m-1]} ${y}`}
function configuredPeriods(){const y=vatYear(),a=[];if(vatRegime()==='trimestriel'){for(let q=1;q<=4;q++){const r=quarterRangeOf(y,q);a.push({key:tvaKeyOf(r),label:`${['1er','2e','3e','4e'][q-1]} trimestre ${y}`})}}else{for(let m=1;m<=12;m++){const r=monthRangeOf(y,m);a.push({key:tvaKeyOf(r),label:`${MONTH_NAMES[m-1]} ${y}`})}}return a}
function vatPeriod(key){state.vatPeriods[key]??={status:'ouverte',validatedAt:'',lockedAt:'',unlockedAt:''};return state.vatPeriods[key]}
function vatLocked(key){return key&&vatPeriod(key).status==='verrouillee'}
function guardVat(key,action){if(vatLocked(key)){toast(`Période TVA verrouillée : impossible de ${action}.`);return false}return true}
function itemVatKey(item){if(item.tvaDecl&&item.tvaDecl!=='reporte')return item.tvaDecl;const d=item.paymentDate||item.date;if(!d)return null;return vatKey(+d.slice(0,4),+d.slice(5,7))}
function docAppliedAvoir(id){return state.docs.filter(a=>a.type==='facture'&&a.nature==='avoir').reduce((s,a)=>s+(a.allocations||[]).filter(x=>x.invoiceId===id).reduce((n,x)=>n+(+x.amount||0),0),0)}
function avoirTotal(a){return Math.abs(computeDoc(a).ttc)}
function avoirUsed(a){return (a.allocations||[]).reduce((s,x)=>s+(+x.amount||0),0)}
function avoirRemain(a){return Math.max(0,avoirTotal(a)-avoirUsed(a))}
function invoiceRemain(d){return Math.max(0,computeDoc(d).ttc-docAppliedAvoir(d.id)-docPaidAmount(d))}
function bankCalc(ttc,rate){ttc=+ttc||0;rate=+rate||0;const ht=rate?ttc/(1+rate/100):ttc;return {ttc,ht,tva:ttc-ht}}
function bankVatKey(x){return x.tvaDecl||vatKey(+x.date.slice(0,4),+x.date.slice(5,7))}
function bankRowsForKey(key){return state.bankServices.filter(x=>bankVatKey(x)===key)}
function bankVatForKey(key){return bankRowsForKey(key).reduce((s,x)=>s+bankCalc(x.ttc,x.rate).tva,0)}
function bankMonthKeys(declKey){const r=vatRange(declKey);if(!r)return[];const y=+r.start.slice(0,4),a=+r.start.slice(5,7),b=+r.end.slice(5,7);const out=[];for(let m=a;m<=b;m++)out.push(vatRegime()==='trimestriel'?tvaKeyOf(monthRangeOf(y,m)):vatKey(y,m));return [...new Set(out)]}
function bankVatForDecl(key){return bankMonthKeys(key).reduce((s,k)=>s+bankVatForKey(k),0)}
function supplierPdf(s){const co=state.company||{};const purchases=state.purchases.filter(p=>p.supplierId===s.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const total=purchases.reduce((n,p)=>n+computePurchase(p).ttc,0);const paid=purchases.reduce((n,p)=>n+purchasePaidAmount(p),0);const remain=total-paid;const html=`<div class="inv-page"><div class="inv-head"><div class="company"><h2>${esc(co.name||'Entreprise')}</h2><p>${esc(co.address||'')}</p><p>${esc(co.phone||'')} ${co.email?'· '+esc(co.email):''}</p>${co.ice?`<p>ICE : ${esc(co.ice)}</p>`:''}</div><div class="inv-title"><div class="doctype">FICHE FOURNISSEUR</div></div></div><div class="card"><h3>${esc(s.name)}</h3><table><tbody>${[['Adresse',s.address],['Téléphone',s.phone],['E-mail',s.email],['IF',s.iff],['ICE',s.ice],['TP / ITP',s.tp],['N° RC',s.rc],['N° CNSS',s.cnss]].map(x=>`<tr><th>${x[0]}</th><td>${esc(x[1]||'—')}</td></tr>`).join('')}</tbody></table></div><div class="totals-box" style="margin-top:12px;"><div><span>Nombre de factures / achats</span><span>${purchases.length}</span></div><div><span>Total TTC</span><span>${fmt(total)} MAD</span></div><div><span>Total payé</span><span>${fmt(paid)} MAD</span></div><div class="ttc"><span>Reste dû</span><span>${fmt(remain)} MAD</span></div></div><div style="margin-top:16px;"><h3 style="font-size:15px;margin-bottom:8px;">Factures / achats</h3>${purchases.length?`<table><thead><tr><th>N°</th><th>Date</th><th>Désignation</th><th>TTC</th><th>Statut</th><th>Mode</th><th>Date débit</th><th>Payé</th><th>Reste</th></tr></thead><tbody>${purchases.map(p=>{const t=computePurchase(p),pa=purchasePaidAmount(p);return `<tr><td>${esc(p.noInvoice?'Sans facture':p.number||'—')}</td><td>${p.date||'—'}</td><td>${esc(p.designation||'—')}</td><td>${fmt(t.ttc)} MAD</td><td>${esc(STATUS_LABEL[p.status]||p.status||'—')}</td><td>${esc(p.paymentMode?(PAYMENT_MODE_LABEL[p.paymentMode]||p.paymentMode):'—')}</td><td>${p.paymentDate||'—'}</td><td>${fmt(pa)} MAD</td><td>${fmt(t.ttc-pa)} MAD</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Aucune facture / achat enregistré.</div>'}</div>${co.footerNote?`<div class="inv-notes" style="margin-top:12px;">${esc(co.footerNote)}</div>`:''}<div class="inv-footer-zone">${co.footerImageReplace&&co.footerImage?`<div style="text-align:center;"><img src="${co.footerImage}" style="max-width:100%;max-height:70px;object-fit:contain;"></div>`:`<div style="font-size:11px;color:#667;">${esc(co.legal||'')}</div>${co.footerImage?`<div style="text-align:center;margin-top:6px;"><img src="${co.footerImage}" style="max-width:100%;max-height:60px;object-fit:contain;"></div>`:''}`}</div></div>`;document.getElementById('printArea').innerHTML=html;const marginMm=co.printMargin!=null?co.printMargin:15;const widthPct=co.printWidthPct!=null?co.printWidthPct:100;const pageEl=document.querySelector('#printArea .inv-page');if(pageEl)pageEl.style.width=widthPct+'%';applyPrintPageStyle(marginMm,true);window.print();setTimeout(()=>document.getElementById('printArea').innerHTML='',300)}

function viewVatBankParams(){const ps=configuredPeriods();return `<div class="topbar"><div><h2>TVA & Banques</h2><p>Année, régime, périodes et banques.</p></div></div><div class="card"><h3 style="font-size:16px;margin-bottom:12px">Configuration TVA</h3><div class="row2"><div class="field"><label>Année comptable</label><input id="vyear" type="number" value="${vatYear()}"></div><div class="field"><label>Régime de TVA</label><select id="vreg"><option value="mensuel" ${vatRegime()==='mensuel'?'selected':''}>Régime mensuel</option><option value="trimestriel" ${vatRegime()==='trimestriel'?'selected':''}>Régime trimestriel</option></select></div></div><button class="btn btn-primary" id="saveVatCfg">Enregistrer</button></div><div class="card"><h3 style="font-size:16px;margin-bottom:12px">Périodes TVA ${vatYear()}</h3><table><thead><tr><th>Période</th><th>Statut</th><th>Action</th></tr></thead><tbody>${ps.map(p=>{const st=vatPeriod(p.key).status;return `<tr><td>${esc(p.label)}</td><td><span class="badge ${st==='verrouillee'?'vat-locked':st==='validee'?'vat-validated':'vat-open'}">${st==='verrouillee'?'Verrouillée':st==='validee'?'Validée':'Ouverte'}</span></td><td>${st==='ouverte'?`<button class="btn btn-ghost btn-sm" data-vv="${p.key}">Valider</button>`:st==='validee'?`<button class="btn btn-gold btn-sm" data-vl="${p.key}">Verrouiller</button>`:`<button class="btn btn-ghost btn-sm" data-vu="${p.key}">Déverrouiller</button>`}</td></tr>`}).join('')}</tbody></table></div><div class="card"><h3 style="font-size:16px;margin-bottom:12px">Banques</h3><button class="btn btn-primary btn-sm" id="newBank">+ Ajouter</button><table style="margin-top:12px"><thead><tr><th>Banque</th><th>RIB / compte</th><th>Clients</th><th></th></tr></thead><tbody>${state.banks.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.rib||'—')}</td><td>${state.clients.filter(c=>(c.bankIds||[]).includes(b.id)).map(c=>esc(c.name)).join(', ')||'—'}</td><td><button class="btn btn-ghost btn-sm" data-eb="${b.id}">Modifier function bankModal(id){const b=id?state.banks.find(x=>x.id===id):null;openModal(id?'Modifier la banque':'Nouvelle banque',`<div class="field"><label>Nom *</label><input id="bn" value="${esc(b?.name||'')}"></div><div class="field"><label>RIB / numéro de compte</label><input id="br" value="${esc(b?.rib||'')}"></div>`,[{label:'Annuler',cls:'btn-ghost',action:closeModal},{label:'Enregistrer',cls:'btn-primary',action:()=>{const name=document.getElementById('bn').value.trim();if(!name){toast('Nom requis');return}if(b){b.name=name;b.rib=document.getElementById('br').value.trim()}else state.banks.push({id:uid(),name,rib:document.getElementById('br').value.trim()});save();closeModal();renderAll();}}])}

/* ---- Tri de la liste des fournisseurs (affichage uniquement : l'ordre enregistré des données n'est jamais modifié) ---- */
let supplierSort={col:'name', dir:'asc'};
const SUPPLIER_COLUMNS=[
  {key:'name',  label:'Nom / Raison sociale'},
  {key:'iff',   label:'IF'},
  {key:'ice',   label:'ICE'},
  {key:'tp',    label:'TP'},
  {key:'rc',    label:'RC'},
  {key:'cnss',  label:'CNSS'},
  {key:'city',  label:'Ville / Adresse'},
  {key:'phone', label:'Téléphone'},
  {key:'ttc',   label:'Total achats TTC', num:true},
  {key:'due',   label:'Solde à payer', num:true},
];
function supplierSortValue(s, col){
  const purchases=state.purchases.filter(p=>p.supplierId===s.id);
  if(col==='ttc') return purchases.reduce((n,p)=>n+computePurchase(p).ttc,0);
  if(col==='due') return purchases.reduce((n,p)=>n+computePurchase(p).ttc-purchasePaidAmount(p),0);
  if(col==='city') return (s.address||'').toLowerCase();
  return (s[col]||'').toString().toLowerCase();
}
function sortedSuppliers(){
  // copie : state.suppliers n'est jamais réordonné
  return [...state.suppliers].sort((a,b)=>{
    const av=supplierSortValue(a,supplierSort.col), bv=supplierSortValue(b,supplierSort.col);
    let r;
    if(typeof av==='number' && typeof bv==='number') r = av-bv;
    else r = String(av).localeCompare(String(bv),'fr',{numeric:true,sensitivity:'base'});
    return supplierSort.dir==='asc' ? r : -r;
  });
}
function viewSuppliers(){

.paymentDate||'—'}</td><td class="num">${fmt(pa)} MAD</td><td class="num">${fmt(t.ttc-pa)} MAD</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Aucune facture fournisseur enregistrée.</div>'}</div><div class="card" style="margin-top:12px;padding:0;overflow:hidden;"><h4 style="padding:12px 14px;margin:0;">Paiements avec ce fournisseur</h4>${payments.length?`<table><thead><tr><th>Date</th><th>Référence</th><th>Facture</th><th>Mode</th><th class="num">Montant</th><th>Statut</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${p.paymentDate||'—'}</td><td>${esc(p.paymentRef||'—')}</td><td>${esc(p.number||'Sans facture')}</td><td>${esc(p.paymentMode?(PAYMENT_MODE_LABEL[p.paymentMode]||p.paymentMode):'—')}</td><td class="num">${fmt(purchasePaidAmount(p))} MAD</td><td>${STATUS_LABEL[p.status]||esc(p.status||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucun paiement enregistré.</div>'}</div>`;openModal('Fiche fournisseur — '+s.name,body,[{label:'Fermer',cls:'btn-ghost',action:closeModal},{label:'Exporter Excel (CSV)',cls:'btn-ghost',action:()=>exportCsv('fiche-fournisseur-'+(s.name||'fournisseur')+'-'+todayISO(),['N°','Date','Désignation','TTC','Statut','Mode paiement','Date débit','Payé','Reste'],purchases.map(p=>{const t=computePurchase(p),pa=purchasePaidAmount(p);return [p.noInvoice?'Sans facture':p.number||'',p.date||'',p.designation||'',t.ttc,STATUS_LABEL[p.status]||p.status||'',p.paymentMode?(PAYMENT_MODE_LABEL[p.paymentMode]||p.paymentMode):'',p.paymentDate||'',pa,t.ttc-pa]}))},{label:'Imprimer / PDF',cls:'btn-gold',action:()=>supplierPdf(s)}]);}


/* ============================= FICHE CLIENT ============================= */
/* Même principe que la fiche fournisseur : informations, situation financière et historique.
   Les avoirs imputés sont pris en compte dans le solde, sans jamais modifier le montant
   d'origine des factures. */
function clientAccount(id){
  const invoices=state.docs.filter(d=>d.type==='facture' && (d.nature||'doit')!=='avoir' && d.clientId===id)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const avoirs=state.docs.filter(d=>d.type==='facture' && d.nature==='avoir' && d.clientId===id)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const rows=invoices.map(d=>{
    const t=computeDoc(d);
    const avoir=docAppliedAvoir(d.id);
    const paid=docPaidAmount(d);
    return {doc:d, ht:t.ht, tva:t.tva, ttc:t.ttc, avoir, paid, remain:Math.max(0,t.ttc-avoir-paid), status:effectiveStatus(d)};
  });
  const totals=rows.reduce((a,r)=>({ht:a.ht+r.ht, tva:a.tva+r.tva, ttc:a.ttc+r.ttc, avoir:a.avoir+r.avoir, paid:a.paid+r.paid, remain:a.remain+r.remain}),
    {ht:0,tva:0,ttc:0,avoir:0,paid:0,remain:0});
  const avoirsTotal=avoirs.reduce((s,a)=>s+avoirTotal(a),0);
  const avoirsUsed=avoirs.reduce((s,a)=>s+avoirUsed(a),0);
  return {invoices, avoirs, rows, totals, avoirsTotal, avoirsUsed};
}

// Périodes de déclaration proposées pour le report manuel des achats — respecte le régime TVA de l'année (mensuel ou trimestriel)
function purchDeclPeriodOptions(){
  const cy=new Date().getFullYear();
  const years=[...new Set([vatYear()+1,vatYear(),vatYear()-1,cy+1,cy,cy-1,...yearsInData()])].sort((a,b)=>b-a);
  const opts=[];
  years.forEach(y=>{
    if(vatRegime()==='trimestriel'){
      for(let q=1;q<=4;q++){ const r=quarterRangeOf(y,q); opts.push({key:tvaKeyOf(r), label:`${['1er','2e','3e','4e'][q-1]} trimestre ${y}`}); }
    } else {
      for(let m=1;m<=12;m++){ const r=monthRangeOf(y,m); opts.push({key:tvaKeyOf(r), label:`${MONTH_NAMES[m-1]} ${y}`}); }
    }
  });
  return opts;
}
// Sélecteur de période de déclaration TVA pour une ligne d'achat — modification manuelle possible, ne concerne que les achats

  return `<select data-purch-decl="${x.id}" style="max-width:170px;padding:3px 6px;font-size:12.5px;">
    <option value="" ${!x.decl?'selected':''}>Auto (date de paiement)</option>

    ${opts.map(o=>`<option value="${o.key}" ${x.decl===o.key?'selected':''}>${o.label}</option>`).join('')}

}

function addAllocation(avoirId){const a=state.docs.find(x=>x.id===avoirId);if(!a||!guardVat(itemVatKey(a),'imputer'))return;const opts=state.docs.filter(x=>x.type==='facture'&&x.nature!=='avoir'&&x.clientId===a.clientId).map(x=>`<option value="${x.id}">${esc(x.number||'Brouillon')} — reste ${fmt(invoiceRemain(x))}</option>`).join('');openModal('Imputer l’avoir',`<div class="field"><label>Facture</label><select id="ai">${opts}</select></div><div class="field"><label>Montant</label><input id="aa" type="number" min="0" max="${avoirRemain(a)}"></div>`,[{label:'Annuler',cls:'btn-ghost',action:closeModal},{label:'Ajouter',cls:'btn-primary',action:()=>{const invoiceId=document.getElementById('ai').value,amount=+document.getElementById('aa').value||0;if(amount<=0||amount>avoirRemain(a)+.0001){toast('Montant supérieur au disponible');return}if(amount>invoiceRemain(state.docs.find(x=>x.id===invoiceId))+.0001){toast('Montant supérieur au reste de la facture');return}a.allocations=a.allocations||[];const e=a.allocations.find(x=>x.invoiceId===invoiceId);if(e)e.amount+=amount;else a.allocations.push({invoiceId,amount});save();closeModal();renderAll()}}])}

/* Valeurs de tri de la liste des documents (factures, avoirs, devis, BL) — affichage uniquement.
   Toutes les colonnes sont triables : n°, client, date, échéance, HT, TVA, TTC, avoirs, payé, reste, statut. */
function docListSortValue(d, col){
  const t=computeDoc(d);
  if(col==='number')     return (d.number||'').toLowerCase();
  if(col==='client')     return (clientById(d.clientId)?.name||'').toLowerCase();
  if(col==='date')       return d.date||'';
  if(col==='dueDate')    return hasDueDate(d)? d.dueDate : '';
  if(col==='paymentDate')return d.paymentDate||'';
  if(col==='ht')         return t.ht;
  if(col==='tva')        return t.tva;
  if(col==='ttc')        return t.ttc;
  if(col==='avoir')      return docAppliedAvoir(d.id);
  if(col==='paid')       return docPaidAmount(d);
  if(col==='remain')     return invoiceRemain(d);
  if(col==='status')     return (STATUS_LABEL[effectiveStatus(d)]||'').toLowerCase();
  if(col==='nature')     return (d.nature||'doit')==='avoir'?'avoir':'facture';
  if(col==='vat')        return vatLabel(itemVatKey(d))||'';
  return d.date||'';
}
function viewDocList(type){
  let ds=state.docs.filter(d=>d.type===type);
  const f=docFilter;
  if(f.nature && f.nature!=='all') ds=ds.filter(d=>((d.nature||'doit')==='avoir'?'avoir':'doit')===f.nature);
  if(f.client && f.client!=='all') ds=ds.filter(d=>d.clientId===f.client);
  if(f.status && f.status!=='all') ds=ds.filter(d=>effectiveStatus(d)===f.status);
  if(f.q) ds=ds.filter(d=>(d.number||'').toLowerCase().includes(f.q.toLowerCase()) || (clientById(d.clientId)?.name||'').toLowerCase().includes(f.q.toLowerCase()));
  // tri sur une COPIE : l'ordre des données enregistrées n'est jamais modifié
  ds=[...ds].sort((a,b)=>{
    const av=docListSortValue(a,docSort.col), bv=docListSortValue(b,docSort.col);
    let r;
    if(typeof av==='number'&&typeof bv==='number') r=av-bv;
    else if(av===''||av==null) r=(bv===''||bv==null)?0:1;
    else if(bv===''||bv==null) r=-1;
    else r=String(av).localeCompare(String(bv),'fr',{numeric:true,sensitivity:'base'});
    return docSort.dir==='asc'?r:-r;
  });
  const sortArrow=(key)=>docSort.col===key?(docSort.dir==='asc'?' ▲':' ▼'):'<span style="opacity:.25;">↕</span>';
  const th=(key,label,num)=>`<th data-sort-doc="${key}" title="Cliquer pour trier (croissant / décroissant)" style="cursor:pointer;user-select:none;${num?'text-align:right;':''}">${label} ${sortArrow(key)}</th>`;
  const statusList=type==='bl'?['brouillon','validee','envoyee']:['brouillon','validee','envoyee','partielle','en_attente','payee','retard','annulee_avoir','partiel_avoir'];
  return `<div class="topbar"><div><h2>${TYPE_LABEL[type]}s</h2><p>Liste complète des documents — cliquez sur un en-tête de colonne pour trier (croissant / décroissant)</p></div><div style="display:flex;gap:8px;"><button class="btn btn-ghost" id="btnExportDocs">Exporter Excel (CSV)</button><button class="btn btn-ghost" id="btnPrintList">Imprimer / PDF</button><button class="btn btn-primary" id="btnNewDoc">+ Nouveau</button></div></div>
  <div class="filters">
    <input placeholder="Rechercher n° ou client…" id="fq" value="${esc(f.q||'')}">
    ${type==='facture'?`<select id="fnature"><option value="all" ${(f.nature||'all')==='all'?'selected':''}>Factures et avoirs</option><option value="doit" ${f.nature==='doit'?'selected':''}>Factures uniquement</option><option value="avoir" ${f.nature==='avoir'?'selected':''}>Avoirs uniquement</option></select>`:''}
    <select id="fclient"><option value="all">Tous clients</option>${state.clients.map(c=>`<option value="${c.id}" ${f.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <select id="fstatus"><option value="all">Tous statuts</option>${statusList.map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select>

/* ============================= AJOUT : PAIEMENTS SANS FACTURE — sous-rubrique dédiée =============================
   Ajout pur, aucune donnée ni fonctionnalité existante n'est modifiée ou supprimée.
   Réutilise le modèle de données déjà en place (state.purchases avec noInvoice:true) et le formulaire
   de saisie existant (openNoInvoicePaymentModal), déjà accessible depuis la page Fournisseurs. */
NAV_GROUPS.find(g=>g.id==='achatsgrp')?.items.push({id:'paiements_sans_facture', label:'Paiements sans facture'});

function noInvoicePayments(){ return state.purchases.filter(p=>p.noInvoice); }

/* Regroupement par fournisseur : sert à la fois à « identifier les fournisseurs ayant des
   paiements sans facture » et à « l'état individuel par fournisseur, avec classement et total ». */
function noInvoiceBySupplier(){
  const map={};
  noInvoicePayments().forEach(p=>{
    const key=p.supplierId||'__inconnu';
    if(!map[key]){ const s=supplierById(p.supplierId); map[key]={supplierId:p.supplierId, name:s?s.name:'Fournisseur supprimé', count:0, total:0, payments:[]}; }
    map[key].count++; map[key].total+=purchasePaidAmount(p); map[key].payments.push(p);
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function noInvoiceReminderText(row){
  const lines = row.payments.slice()
    .sort((a,b)=>(a.paymentDate||a.date||'').localeCompare(b.paymentDate||b.date||''))
    .map(p=>`- ${p.paymentDate||p.date||'—'} : ${fmt(purchasePaidAmount(p))} MAD${p.paymentMode?' ('+(PAYMENT_MODE_LABEL[p.paymentMode]||p.paymentMode)+')':''}${p.notes?' — '+p.notes:''}`)
    .join('\n');
  return `Bonjour ${row.name},\n\nNous vous confirmons avoir réglé les paiements suivants pour lesquels nous n'avons pas encore reçu la facture correspondante :\n${lines}\n\nSoit un total de ${fmt(row.total)} MAD. Merci de bien vouloir nous transmettre la ou les factures correspondantes dans les meilleurs délais.\n\nCordialement.`;
}
function copyNoInvoiceReminder(supplierId){
  const row = noInvoiceBySupplier().find(r=>r.supplierId===supplierId);
  if(!row){ toast('Aucun paiement sans facture pour ce fournisseur'); return; }
  const text = noInvoiceReminderText(row);
  navigator.clipboard?.writeText(text);
  toast('Message de relance copié');
}

  const rows = noInvoicePayments().slice().sort((a,b)=>(b.paymentDate||b.date||'').localeCompare(a.paymentDate||a.date||''));

  const total = rows.reduce((n,p)=>n+purchasePaidAmount(p),0);
  return `
  <div class="topbar">
    <div><h2>Paiements sans facture</h2><p>Décaissements fournisseurs enregistrés sans numéro de facture — en attente de régularisation</p></div>

  <div class="card">
    <h3 style="font-size:16px;margin-bottom:12px;">État individuel par fournisseur — classement et total</h3>
    ${bySupplier.length? `<table><thead><tr><th>#</th><th>Fournisseur</th><th class="num">Nb. paiements</th><th class="num">Total réglé</th><th></th></tr></thead><tbody>
      ${bySupplier.map((r,i)=>`<tr>
        <td>${i+1}</td>
        <td>${esc(r.name)}</td>
        <td class="num" style="text-align:right">${r.count}</td>
        <td class="num" style="text-align:right;color:var(--danger);font-weight:600">${fmt(r.total)} MAD</td>
        <td style="white-space:nowrap;">${r.supplierId?`<button class="btn btn-ghost btn-sm" data-remind-noinv="${r.supplierId}">Copier la relance</button>`:''}</td>
      </tr>`).join('')}
    </tbody></table>` : `<div class="empty">Aucun paiement sans facture enregistré.</div>`}
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    <h3 style="font-size:16px;margin:14px 0 12px 14px;">État global — tous les paiements sans facture</h3>
    ${rows.length? `<table><thead><tr><th>Date paiement</th><th>Fournisseur</th><th>Mode</th><th>Observation</th><th class="num">Montant</th><th></th></tr></thead><tbody>
      ${rows.map(p=>{const s=supplierById(p.supplierId); return `<tr>
        <td>${p.paymentDate||p.date||'—'}</td>
        <td>${s?esc(s.name):'<span style="color:var(--danger)">fournisseur supprimé</span>'}</td>
        <td>${p.paymentMode?esc(PAYMENT_MODE_LABEL[p.paymentMode]||p.paymentMode):'—'}</td>
        <td style="max-width:260px;color:var(--ink-soft)">${esc(p.notes||p.designation||'')||'—'}</td>
        <td class="num" style="text-align:right;font-weight:600">${fmt(purchasePaidAmount(p))} MAD</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-ghost btn-sm" data-edit-noinv="${p.id}">Modifier</button>
          <button class="btn btn-danger btn-sm" data-del-noinv="${p.id}">Suppr.</button>
        </td>
      </tr>`}).join('')}
    </tbody></table>` : `<div class="empty">Aucun paiement sans facture enregistré. Utilisez le bouton « + Paiement sans facture » pour en ajouter un.</div>`}
  </div>`;

  document.getElementById('btnNewNoInvoicePayment2')?.addEventListener('click', ()=>openNoInvoicePaymentModal(null));
  document.querySelectorAll('[data-edit-noinv]').forEach(b=>b.onclick=()=>openNoInvoicePaymentModal(b.dataset.editNoinv));
  document.querySelectorAll('[data-del-noinv]').forEach(b=>b.onclick=()=>{
    if(confirm('Supprimer ce paiement sans facture ?')){ state.purchases = state.purchases.filter(p=>p.id!==b.dataset.delNoinv); save(); renderAll(); toast('Paiement supprimé'); }
  });
  document.querySelectorAll('[data-remind-noinv]').forEach(b=>b.onclick=()=>copyNoInvoiceReminder(b.dataset.remindNoinv));
  document.getElementById('btnExportNoInvGlobal')?.addEventListener('click', ()=>exportCsv('paiements-sans-facture-'+todayISO(),
    ['Date paiement','Fournisseur','Mode','Référence','Observation','Montant payé'],
    noInvoicePayments().slice().sort((a,b)=>(a.paymentDate||a.date||'').localeCompare(b.paymentDate||b.date||''))
      .map(p=>[p.paymentDate||p.date||'', supplierById(p.supplierId)?.name||'', p.paymentMode?(PAYMENT_MODE_LABEL[p.paymentMode]||p.paymentMode):'', p.paymentRef||'', p.notes||p.designation||'', purchasePaidAmount(p)])
  ));
  document.getElementById('btnPrintNoInv')?.addEventListener('click', ()=>printListArea('Paiements sans facture'));
}

/* Routage de la nouvelle sous-rubrique : on enveloppe renderAll une fois de plus, sans toucher
   à la logique existante des autres vues (appelée normalement via _renderAllWithNoInv). */
const _renderAllWithNoInv = renderAll;
renderAll = function(){
  if(currentView==='paiements_sans_facture'){
    renderNav();
    const root=document.getElementById('viewRoot');
    root.innerHTML = viewNoInvoicePayments();
    bindViewEvents();
    bindNoInvoicePaymentsEvents();
    return;
  }
  _renderAllWithNoInv();
};

/* Lien depuis la page Fournisseurs vers la nouvelle sous-rubrique dédiée.
   Le bouton existant "+ Paiement sans facture" n'est pas modifié : il continue d'ouvrir
   directement le formulaire de saisie, exactement comme avant. */
const _viewSuppliersWithNoInvLink = viewSuppliers;
viewSuppliers = function(){
  const h = _viewSuppliersWithNoInvLink();
  return h.replace(
    '<button class="btn btn-gold" id="btnNoInvoicePayment">+ Paiement sans facture</button>',
    '<button class="btn btn-ghost" id="btnGoNoInvoicePayments">Voir les paiements sans facture</button><button class="btn btn-gold" id="btnNoInvoicePayment">+ Paiement sans facture</button>'
  );
};
const _bindViewEventsWithNoInvLink = bindViewEvents;
bindViewEvents = function(){
  _bindViewEventsWithNoInvLink();
  document.getElementById('btnGoNoInvoicePayments')?.addEventListener('click', ()=>{ currentView='paiements_sans_facture'; renderAll(); });
};

/* ============================= INIT ============================= */
renderAll();
</script>
</body>
</html>
